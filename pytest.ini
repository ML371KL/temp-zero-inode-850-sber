[pytest]
testpaths = tests
pythonpath = .
# Временные каталоги тестов — в var/ (он в .gitignore, в git только .gitkeep):
# системный temp машины разработчика бывает недоступен на запись.
# ДВА ПРОГОНА ОДНОВРЕМЕННО — ТОЛЬКО С РАЗНЫМИ КАТАЛОГАМИ: pytest при старте
# стирает свой basetemp, и второй прогон с тем же каталогом стёр бы песочницы
# первого на ходу (так в рабочей копии однажды появился посторонний коммит).
# Параллельный прогон задаёт свой каталог:
# --basetemp=var/pytest-<ключ>-<случайное>; каталог, занятый идущим прогоном,
# второй не получит — отказ при старте (замок рядом с каталогом, tests/conftest.py).
# По умолчанию — без сети и без папки передачи (docs/INTERFACES.md §9).
# --strict-markers и здесь, а не только в CI: опечатка в метке (`tatc`) молча
# выводила бы тест из такта сервера.
addopts = -q -m "not network and not archive" --strict-markers --basetemp=var/pytest-tmp
markers =
    tact: тест такта — БЕЛЫЙ СПИСОК проверок, которые ops/run.sh гоняет на сервере
        перед каждой сборкой (TACT_TESTS в ops/run.sh); тест без метки идёт только
        в CI и в полном прогоне. Быстрые тесты такта есть у каждого потока (ядро,
        книга, факты, индикаторы, витрина, контрольная модель, перезаякоривание,
        эксплуатация — tests/test_ops_tact_suite.py). Цель — весь набор такта не
        дольше 3 минут на сервере (ops/budgets.json, tact_tests_target; сверяется
        замером шага в журнале такта); шаг CI с тем же набором краснеет после
        300 с (tact_tests_ci_ceiling). Набор сервера уже, чем `-m tact` —
        выражение исключает docs, archive и deadline; он обязан быть зелёным на
        любой будущей дате (FAKE_TODAY)
    docs: тест читает документ *.md репозитория; такт их не гоняет, в CI идут
        и в общем наборе, и отдельно (.github/workflows/docs.yml)
    ci_only: только CI (полный выпуск с полосой, статика витрины, инструменты
        оператора, CI-файлы); такт (ops/run.sh) не гоняет, сторож в tests/conftest.py
        не даёт полному выпуску вернуться в такт
    network: тест ходит в сеть; в CI и на сервере пропускается (выражением -m)
    archive: тесту нужна папка передачи ($BANK_HANDOFF_DIR: листы этапа 1,
        первичка, личный список слов гигиены); в CI и на сервере пропускается
        (выражением -m). Сверка личных слов, выбранная явно (`-m archive`), без
        папки передачи или без списка в ней КРАСНЕЕТ, а не пропускается
    deadline: тест срока — падает, когда срок записи данных прошёл (объяснение
        сработавшего гейта действует на сегодня). В набор сервера (TACT_TESTS) и
        в прогоны «в будущем» не входит: срок проверяет сама сборка (отказ при
        сработавшем гейте без действующего объяснения), о его приближении
        сообщает плашка выпуска; идёт в CI и в ручном прогоне
