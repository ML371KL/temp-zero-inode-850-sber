# Письменные объяснения сработавших гейтов правдоподобия — книга Сбербанка (MODEL §14.2; читает model/checks.py).
#
# Правило семейства: гейт — не ошибка, а место, где модель расходится с историей, гайденсом или рынком; расходиться
# можно, не замечать — нельзя. Сборку выпуска роняет (код 1) только сработавший гейт без действующего объяснения: нет
# записи здесь, истёк срок (valid_until действует включительно) или масса вне коридора 0,4 × lo − 0,02 … 1,5 × hi + 0,02.
# Объяснение, которому до срока меньше 30 дней, — плашка выпуска «объяснение истекает», не тревога и не отказ
# (MODEL §14.3).
#
# Масса — суммарная вероятность клеток слоя «свой взгляд», где условие нарушено (у гейтов уровня выпуска — 1).
# Имена гейтов — MODEL §14.2: pb_by_world, roe_range, cor_range, nim_range, cir_range, roe_k_homogeneity, guidance_gap,
# capital_gap, k_gt_g, roe_gt_g, terminal_share, real_rate, bridge_drift, m_crisis_vs_cbr, manual_input_overdue,
# nim_path_joint, transmission_pairs, lt_spread_floor, off_band_shift. Коридоры гейтов — в книге (блок checks шаблона),
# не здесь.
#
# ТЕКСТ ОБЪЯСНЕНИЯ ПЕЧАТАЕТ ВИТРИНА — он пишется словами для владельца (PAYLOAD §0.2): без имён ключей и полей, без
# меток класса допущения в скобках, без ссылок на листы и файлы, без рабочих пометок; доли — в процентах, разности долей
# — в п.п., даты — с годом. Записи — только у сработавших гейтов: запись тихого гейта снимается.
#
# Формат записи:
#
#   capital_gap:
#     explanation: >-
#       Что нарушено, в каких клетках и почему это правильно (или почему книга с этим согласна) — текстом для владельца.
#     expected_mass: 0.045                 # ожидаемая масса гейта; либо коридор дрейфующей массы:
#     # expected_mass_range: [0.04, 0.06]  # (масса законно дрейфует с датой оценки — перекат, доля остатка квартала)
#     valid_until: 2026-11-30              # включительно; объяснение книги с якорем 2К26 живёт до перезаякоривания
#
# Книга 1.3. Срабатывают четыре гейта: guidance_gap, roe_k_homogeneity, pb_by_world, m_crisis_vs_cbr. Запись
# lt_spread_floor снята: с раскладкой сжатия маржи между кредитными ставками и средствами клиентов гейт проходит во всех
# мирах. Массы и числа записей сверены с полным прогоном книги 1.3 (python -B -m model.book_results, results.json).
# Срок guidance_gap — ближайший МСФО (3К26, 28.10.2026); остальные — до 30.11.2026: к этому сроку книга перезаякорена
# на 9М26, и записи пишутся заново по массам нового прогона.

guidance_gap:
  explanation: >-
    Год гайденса 2026 (факт первого полугодия плюс модель второго) выходит за гайденс банка от 29.07.2026 во всех
    36 клетках. Чистая процентная маржа за год — 6,61–6,64 % против гайденса около 6,2 % (полоса 6,15–6,25 %) — во
    всех клетках; ROE — 22,6–23,1 % против около 22 % (21,5–22,5 %) — в клетках мягкой посадки и части клеток
    нормализации; стоимость риска в клетках спада и кризиса — на границе гайденса «ниже 1,4 %». Отношение расходов к
    доходам — внутри гайденса 30–32 %. Причина — маржа второго полугодия: общий ближний сдвиг −0,5 п.п. не опускает
    расчёт книг до уровня, который следует из гайденса на второе полугодие (5,9–6,0 %); отсюда и ROE. Книга с
    гайденсом по марже второго полугодия не согласна по существу: ожидание модели на третий квартал — около 6,7 %,
    оценка по отчётности РСБУ за два месяца квартала — 6,78 %; рассудит отчёт МСФО за третий квартал 2026 года. По
    правилу гейта объяснение действует до ближайшего отчёта МСФО (28.10.2026); к нему книга перезаякоривается на факт
    девяти месяцев.
  expected_mass: 1.0
  valid_until: 2026-10-28

roe_k_homogeneity:
  explanation: >-
    Избыточная доходность терминала — ROE минус стоимость капитала — расходится между сценариями ставок больше предела
    книги 5 п.п.: при нормализации ставок +1,4 п.п., при высоких ставках надолго +0,6 п.п., при рыночных ставках как
    есть −3,8 п.п.; разрыв — 5,2 п.п. Причина — суждение книги о передаче ставки в маржу: 0,06 п.п. маржи на 1 п.п.
    ключевой ставки. В сценарии рыночных ставок (ключевая 17 %) маржа почти не выше, чем при нормализации (ключевая
    8 %), а стоимость капитала выше на 7,7 п.п. В книге 1.2 разрыв был 4,5 п.п.: остановка и замедление кредита в
    спаде и кризисе поддерживали доходность сценария рыночных ставок, потому что всё сжатие маржи лежало на кредитных
    ставках и кредит там был убыточен. С книги 1.3 сжатие несут средства клиентов, кредит прибылен во всех сценариях,
    и этой поддержки нет. Книга с разрывом согласна: это цена взгляда рынка на ставки — нижний конец оси ставок.
    Гейт сравнивает сценарии целиком, поэтому масса — все клетки. Объяснение — до 30.11.2026.
  expected_mass: 1.0
  valid_until: 2026-11-30

pb_by_world:
  explanation: >-
    Клетки «рыночные ставки как есть × кризис» при всех трёх сценариях надбавок к капиталу (вес 20 % × 15 % = 3 %):
    оценка — 0,23–0,33 капитала при нижней границе коридора 0,4. Это самые тяжёлые клетки сетки: ставки рынка как
    есть, кризис с отменой выплаты и разовым убытком, два года почти без роста кредита при высокой инфляции;
    доходность терминала 13,7–14,1 % при стоимости капитала 21,3 %. В книге 1.2 ниже границы была одна клетка (0,397):
    остановка кредита в сценарии рыночных ставок работала как выигрыш, потому что всё сжатие маржи лежало на кредитных
    ставках. С книги 1.3 сжатие несут средства клиентов, кредит в этом сценарии прибылен, и остановка кредита —
    потеря. Нижняя граница коридора — суждение книги; книга согласна, что худшие клетки стоят ниже неё. Объяснение —
    до 30.11.2026.
  expected_mass: 0.03
  valid_until: 2026-11-30

m_crisis_vs_cbr:
  explanation: >-
    Клетки «рыночные ставки как есть × кризис» с надбавками «верхней группы» и «жёсткими» (вес 20 % × 15 % × 30 % =
    0,9 %) мягче рискового сценария Банка России по капиталу: минимум норматива Н20.0 — 13,8 %, выше порога книги
    13,3 %. В клетке с надбавками по графику минимум ниже порога, гейт её не берёт. Рост кредита и стоимость риска
    года шока — в коридоре. Норматив держат дивидендная политика с проверкой Н20.0 не ниже 13,3 % и перенос выплаты
    кризисного года; порог минимума норматива — суждение книги до результата стресс-теста Банка России. Объяснение —
    до 30.11.2026 или до стресс-теста.
  expected_mass: 0.009
  valid_until: 2026-11-30
