  cor_range: [0.004, 0.05]                                     # CoR года, базис движка; история упр. 0,56–2,5 % (2009 — 7,25) [В]
  nim_range: [0.035, 0.080]                                    # ЧПМ квартала, упр. базис (через мост); история 3,7–7,9 % [В]
  cir_range: [0.25, 0.45]                                      # CIR года; история 29,2–46,1 % [В]
  roe_k_spread: {range: [-0.10, 0.10], max_world_gap: 0.05}    # ROE'_T − k_T клетки и разрыв средних по мирам (однородность) [В]
  terminal_share: [0.15, 0.65]                                 # доля PV терминала в V (DDM) [Ф: X5; 850oa]
  real_rate: [0.02, 0.13]                                      # реальная ставка мира в терминале [Ф: 850oa]
  bridge_drift_pp: {cor: 0.004, nim: 0.004}                    # дрейф моста упр. ↔ МСФО, доли: ≈2,5σ моста CoR (0,16 п.п.); мост ЧПМ 0,41 против 0,5–0,7 в 2019–2022 [Р/В]
  m_crisis_vs_cbr:                                             # «M × кризис» против рискового сценария ЦБ [Ф: ОНДКП табл. 3.5; regimes §8]
