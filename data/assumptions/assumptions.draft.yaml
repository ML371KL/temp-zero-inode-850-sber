    cor_shock_year: 0.024                                      # CoR года шока (упр. базис) не ниже; движок ≈0,026 [Р: ВВП-чувствительность 0,4–0,7]
    n20_min: 0.133                                             # минимум Н20.0 клетки не выше — до результата стресс-теста ЦБ [В]
  manual_overdue_days: {ifrs_fact: 7, worlds_after_cbr: 21, dividend_register: 5}   # сколько дней после события вход может ждать [В]
  book_update: {shift_bp: 50, max_age_days: 45}                # совещательный флаг [Ф: 850oa]
