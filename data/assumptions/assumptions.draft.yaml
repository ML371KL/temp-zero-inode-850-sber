    search_pad: 0.002                                          # расширение отрезка поиска нейтральных значений за крайние строки, доли

# ------------------------------------------------------------------ КОРИДОРЫ ГЕЙТОВ И ДОПУСКИ ИНВАРИАНТОВ (MODEL §14) — стартовые [В] сводки этапа 1 §5.3
checks:
  ddm_ri_tol: 0.001                                            # инвариант ddm_equals_ri: |V_DDM − V_RI| / V_RI в клетке [Ф: DESIGN §3.1 — 0,1 %]
  transmission_tol: 1.0e-9                                     # инвариант transmission_solved: |Nss(H) − target_eng| и |T_real − T*| (реализованная передача);
                                                               #   локальная T(W) — диагностика без гейта
  exdate_jump_tol: 0.01                                        # инвариант exdate_jump: скачок на экс-дату = −DPS ± 1 % DPS [Ф: DESIGN §3.6]
  pb_by_world: {N: [0.4, 2.0], H: [0.4, 2.0], M: [0.4, 2.0]}   # V/BV клетки по мирам [В]
