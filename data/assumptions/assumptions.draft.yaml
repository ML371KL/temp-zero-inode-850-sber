# Книга допущений Сбербанка (850-sber) — машинный вид. ЧЕРНОВИК КНИГИ 1.0 (01.10.2026) — основа шаблона assumptions_template.yaml.
# Схема ключей — полная (docs/MODEL.md, приложение A); значения — книги 1.0 (решения ведущего 01.10.2026 и сводка этапа 1, §5).
# Метки в комментариях:
#   [Ф]  — факт с источником; [Р] — расчёт по фактам; [В] — суждение (DESIGN, этап 1 или автор книги);
#   [НП] — не проверено по первичке (вторичный источник).
#   null — только там, где ядро ключ не читает: выключенный блок (`enabled: false` или названный выключатель, MODEL прил. A)
#          или хэш файла, который строит сборка книги; в читаемом пути null — отказ BookError (null ≠ 0).
#   "anchor" — значение выводится из фактов якоря (data/facts/*.json) при загрузке книги (формула — MODEL прил. A).
# Единицы: деньги — млрд ₽; акции — млн шт.; ставки, темпы, доли — доли единицы, годовые; п.п. — тоже доли (0,001 = 0,1 п.п.).
# Траектории: {ключ: значение}; ключи "2026Q3" (квартал), "2026H2" (полугодие), "2027" (год), LT и LT_from (год выхода на LT).
# Правило чтения — docs/MODEL.md §0.4. Незнакомый ключ — отказ BookError (закрытая схема).
# Источники: DESIGN — проект модели v0.3; этап 1 — листы и отчёты калибровок (calib-nii, calib-capital, regimes, market,
#   regulation, mgmt, ifrs; сводка критика §5); перенос расчётов в evidence/<область>/ — задача книги 1.0.

meta:
  version: "1.0-draft"
  date: "2026-09-30"                 # дата книги
  facts_date: "2026-06-30"           # отчётная дата якоря (МСФО 6М26)
  anchor_period: "2026Q2"            # последний отчётный квартал
  first_period: "2026Q3"             # первый прогнозный квартал
  last_period: "2036Q4"              # последний квартал явного участка; терминал — с 2037
  valuation_date: "2026-09-30"       # дата оценки книги = дата рыночной цены книги
  curve_as_of: "2026-09-18"          # дата кривых миров (запись 850oa 1.6); перекат — MODEL §0.5
  market_price: {SBER: 272.87, SBERP: 273.77}   # ₽, ISS LAST 30.09.2026 15:05 МСК [Ф] — цена книги (регрессия results.json)
  basis: "МСФО группы ПАО Сбербанк"  # базис строк движка; упр. метрики — через мост facts/bridge_mgmt_ifrs.json
  step: quarter                      # шаг ядра
  day_count: act365                  # начисление процентов: ставка × остаток × дни/365 (MODEL §0.3)
  company:                           # единственный дом литералов эмитента (тест на литералы в model/, indicators/, web/)
    name: "Сбербанк"
    tickers: [SBER, SBERP]           # SBER — главный (герой витрины), SBERP — вторая линия рынка
    main_ticker: SBER
    cbr_regnum: 1481                 # рег. № ЦБ (формы 101/102/123/135)
    fiscal_year_end: "12-31"

# ------------------------------------------------------------------ МИРЫ (A-M*) — общие с 850oa, X5, Лентой
worlds:
  source:                            # байтовая копия записи 850oa
    record: worlds_source.json       # data/assumptions/worlds_source.json — копия бит в бит
    origin: "magnit-850oa book-1.6"  # [Ф] DESIGN §3.3
    record_asof: "2026-09-21"        # поле asof записи [Ф]
    curve_date: "2026-09-18"
    sha256: "7296567d5200b5599efd0989de6ed8c8461d56c5c5dda244ab7d622303969fec"   # [Ф] запись 850oa 1.6; проверка — worlds_recipe.py --check (схема Ленты)
    recipe: [worlds_inputs.yaml, worlds_recipe.py, WORLDS-RECIPE.md]
  build:                             # блок worlds.<N|H|M> машинной книги пишет build_assumptions.py из копии (MODEL §3.1)
    script: build_assumptions.py
    fields: [key_rate, cpi, wage_growth, ofz_1y, ofz_3y, ofz_5y, ofz_10y, real_key, zero_curve, lt_inflation]
  quarter_rule: half_year_value      # квартал берёт значение своего полугодия (MODEL §0.4, правило 2)
  ids: [N, H, M]
  overlay:                           # банковская надстройка миров (MODEL §3.1, прил. B) — отдельный файл со своим хэшем
    file: worlds_bank.json           # data/assumptions/worlds_bank.json; строит evidence/worlds_bank/build_overlay.py из черновика надстройки этапа 1
    sha256: null                     # ставит сборка надстройки (книга 1.0); ядро сверяет файл с этим хэшем
    fields: [credit_growth.corporate, credit_growth.mortgage, credit_growth.retail_other, funds_growth.retail, funds_growth.corporate, nominal_gdp_growth]
    # N — таблица базового сценария ОНДКП (табл. 3.2–3.5, проект 30.09.2026, sha256 3c3270ef…); H и M — пересчёт по инфляции мира.
    # Середины диапазонов → доли; funds_growth.retail = funds_growth.corporate = M2 (раздельных рядов нет); годы — по 2029,
    # далее ядро сводит рост к g_T мира к volumes.lt_from [Р: сводка этапа 1 §1 п. 22].

# ------------------------------------------------------------------ СОВМЕСТНЫЕ ВЕРОЯТНОСТИ (A-P*)
joint:
  world_prob: {N: 0.35, H: 0.45, M: 0.20}                # A-P1: слой «свой макро-взгляд» [Ф: 850oa 1.6; DESIGN §3.4]
  world_prob_market_implied: {N: 0.10, H: 0.25, M: 0.65} # A-P1m: слой «вменённые рынком» [Ф: 850oa 1.6]
  macro_neutral_world: M                                 # A-P1n: слой «рыночные ставки как есть» [Ф: 850oa]
  own_macro_confidence: 0.5                              # A-P1c: λ, доля [Ф: 850oa; DESIGN §3.6]
  regime_prob: {soft: 0.15, norm: 0.40, downturn: 0.30, crisis: 0.15}   # A-P2b: одна конвенция во всех мирах и слоях [Р/В: regimes — частота 2008–2025
                                                         #   (кризис 3 из 18 лет, шок в окне 1,25 года ≈ 0,19), сигналы 6М26]; вероятность кризиса 10–25 % — ось полосы
  reg_prob_given_regime:                                 # A-K1b: P(сценарий капитала | режим), доли [В: DESIGN §3.4; опоры этапа 1 нет]; ось — mix обратного расчёта
    soft:     {schedule: 0.25, upper: 0.45, strict: 0.30}
    norm:     {schedule: 0.25, upper: 0.45, strict: 0.30}
    downturn: {schedule: 0.25, upper: 0.45, strict: 0.30}
    crisis:   {schedule: 0.70, upper: 0.25, strict: 0.05}   # в кризисе масса смещена к «по графику» (антициклическая надбавка распускается) [В: DESIGN §3.4]
  regime_update:                                         # A-P2u: квартальные наблюдения CoR и ЧПМ (MODEL §12)
    observables:
      cor: {sigma_pp: 0.0035, rho_q: 0.5}                # σ — стационарное с.о. отклонения CoR от пути, доли годовых [Р: regimes — шум квартала 0,33 п.п., 2016–2025];
                                                         #   ρ за квартал [В: VM §8.13]
      nim: {sigma_pp: 0.002, rho_q: 0.7}                 # σ [Р: regimes — ЧПМ к/к 0,19 п.п.]; ρ [В: VM §8.13]
    max_shift_pp: 0.05                                   # предел сдвига вероятности режима за одно квартальное наблюдение: 0,10 850oa «на полугодие» / 2 [Р]
    shrink_by_se: true                                   # у нау-каста (se > 0) — Калман со сжатием (850oa Р12)
    observations: []                                     # [{period: "2026Q3", cor: 0.012, nim: 0.060, se_cor: 0.0, se_nim: 0.0, basis: mgmt}] — факт МСФО 3К26 (28.10.2026)

# ------------------------------------------------------------------ РЕЖИМЫ ДОХОДНОСТИ И КРЕДИТНОГО ЦИКЛА (A-C*b)
# CoR режимов — УПРАВЛЕНЧЕСКИЙ базис (cor_basis: mgmt): ядро переводит пути мостом to_engine_cor (MODEL §4.6; факт
# bridge_mgmt_ifrs.cor = +0,0017, окно 1К24–2К26). Центры [Р/В: regimes — референс-класс 2008–2026; DESIGN §3.4].
# Взвешенный LT-CoR 1,53 % упр. ≈ 1,70 % движок [Р]. Ключ "2026" действует на 2026К3–К4 (якорь — 2026К2).
# Ближний сдвиг ЧПМ −0,005 в 3К–4К26, общий для всех режимов (калибровка calib-nii §5: механика книг 3К26 ≈6,85 % движок
# против гайденса 6,2 % упр.; РСБУ июля–августа ≈ −0,2 п.п. маржи), с 2027 — 0 плюс сдвиг режима.
regimes:
  ids: [soft, norm, downturn, crisis]
  cor_basis: mgmt                    # базис путей cor: mgmt (перевод to_engine_cor в ядре) | engine
  soft:
    name: "Мягкая посадка"
    cor: {"2026": 0.012, "2027": 0.010, "2028": 0.009, "2029": 0.010, LT: 0.011, LT_from: 2030}   # аналог 2017→2019 [Р: regimes]
    nim_shift: {"2026": -0.005, "2027": 0.001, LT: 0.002, LT_from: 2029}                        # +0,1 п.п. в 2027, LT +0,2 п.п. [В: regimes]
    loan_growth_adj: {"2026": 0.0, "2027": 0.01, "2028": 0.01, LT: 0.0, LT_from: 2029}         # +1 п.п. к миру в 2027–28 [Р: regimes — Сбер в доброкачественные годы растёт быстрее сектора]
  norm:
    name: "Нормализация"
    cor: {"2026": 0.014, "2027": 0.015, "2028": 0.014, "2029": 0.014, LT: 0.014, LT_from: 2030}   # [В: DESIGN §3.4 = regimes]
    nim_shift: {"2026": -0.005, LT: 0.0}                                                         # база; LT 0
    loan_growth_adj: {LT: 0.0}
  downturn:
    name: "Корпоративный спад"
    cor: {"2026": 0.016, "2027": 0.023, "2027Q1": 0.021, "2027Q2": 0.023, "2027Q3": 0.024, "2027Q4": 0.024, "2028": 0.020, "2029": 0.016, LT: 0.017, LT_from: 2030}
                                                                                                 # профиль 2027 — признание растянуто реструктуризациями [В: regimes]
    nim_shift: {"2026": -0.005, "2027": -0.002, "2028": -0.002, LT: -0.001, LT_from: 2029}       # −0,2 п.п. в 2027–28, LT −0,1 п.п. [В: regimes]
    loan_growth_adj: {"2026": 0.0, "2027": -0.03, "2028": -0.03, LT: 0.0, LT_from: 2029}        # −3 п.п. к миру (проинфляционный сценарий ЦБ) [В: DESIGN §3.4; regimes]
  crisis:
    name: "Кризис"
    cor: {"2026": 0.016, "2027": 0.038, "2027Q1": 0.050, "2027Q2": 0.040, "2027Q3": 0.034, "2027Q4": 0.028, "2028": 0.025, "2029": 0.016, LT: 0.020, LT_from: 2030}
                                                                                                 # профиль МСФО 9 — пик в квартале шока [В: regimes]
    nim_shift: {"2026": -0.005, "2027": -0.004, LT: -0.002, LT_from: 2028}                      # −0,4 п.п. на 4 квартала 2027, LT −0,2 п.п. [В: regimes; ось 2027 0…−0,012]
    loan_growth_adj: {"2026": 0.0, "2027": 0.0, "2028": 0.0, "2029": 0.01, LT: 0.0, LT_from: 2030}   # 2027–28 заменяет override; +1 п.п. в 2029 [В: regimes]
    loan_growth_override: {"2027": 0.025, "2028": 0.045}       # абсолютный рост кредита: середины рискового сценария ЦБ 0–5 % / 2–7 % [Р: ОНДКП табл. 3.5]
    one_off_loss: {period: "2027Q1", amount: -400.0}           # разовый убыток до налога ≈5 % BV [Р/В: regimes — 2008 5 %, 2014 0,5 %, 2022 11,9 %; ось 0…−1 000]
    shock_year: 2027                                           # год кризиса: отменяется выплата, решаемая в этом году (за 2026) [В: DESIGN §3.5 п. 7]

credit:                                                        # резервы (MODEL §4.6); CoR движка = llp_debt_fa / средние валовые кредиты АС
  kappa: 0.05                                                  # A-C2b: доля CoR на долю реальной ставки мира сверх мира N [Р/В: regimes — регрессии 2014–2026 −0,02…+0,03,
                                                               #   текущий цикл 0,07–0,10; ось 0–0,15]
  real_rate_lag_q: 4                                           # L, кварталов [В: regimes]
  segment_relative: {enabled: false, corporate: null, retail: null}   # сегментная CoR выключена в 1.0: пропорциональная схема даёт неверный знак в «спаде»
                                                               #   (упр. 2024–2026: ЮЛ 0,52 %, ФЛ 2,10 % [Ф: mgmt]); при enabled: true — отношения к общей CoR
  fv_loans_factor: 1.0                                         # кредитная переоценка кредитов по СС = factor × CoR × средние кредиты СС [В: spec]
  allowance_ratio: anchor                                      # резерв / валовые кредиты АС — как на якоре: 2 605,1 / 48 473,1 = 0,0537 [Ф: МСФО 6М26 с. 16]

# ------------------------------------------------------------------ ЧПД: КНИГИ СО СПРЕДОМ И ЛАГОМ (A-N*)
# 10 книг схемы; mortgage и retail_loans — одинаковые параметры ставки (история не различает рыночную ипотеку и прочую
# розницу — одна упр. доходность ФЛ), раздельны сектор роста и плотность RWA [Р: calib-nii (МСФО, 2018К4–2026К2); решение ведущего].
# spread — траектория спреда к ref в мире H (s_b^H), доли; у активов в форме движка s − (1 − a)·ref_H(q) — наклон истории a < 1
# перенесён в траекторию; rho — доля подстройки за квартал; beta — передача ключевой в ставку пассива.
# phi — книга участвует в сжатии спреда со ставкой (φ); lt_shift — книга несёт общий сдвиг LT-спредов σ0 (MODEL §4.5).
nii:
  books:
    corp_loans:     {side: asset, ref: ofz_1y, rho: 0.33, spread: {"2026": 0.00286, "2027": 0.00285, "2028": 0.00428, "2029": 0.00536, "2030": 0.00608, LT: 0.00666, LT_from: 2031}, phi: true, lt_shift: true, sector: corporate, cor_segment: corporate, fv_share: anchor}
                    # коммерческие + проектное (АС) + кредиты по СС; a = 0,894, ρ 95 % 0,30–0,37, RMSE 0,35 [Р: calib-nii]
    mortgage:       {side: asset, ref: ofz_3y, rho: 0.12, spread: {"2026": 0.02209, "2027": 0.0239, "2028": 0.02785, "2029": 0.03064, "2030": 0.03229, LT: 0.03408, LT_from: 2031}, phi: true, lt_shift: true, sector: mortgage, cor_segment: retail}
                    # рыночная ипотека; ставка — как у retail_loans [Р: calib-nii, a = 0,716, ρ 95 % 0,06–0,18]
    mortgage_sub:   {side: asset, ref: key, rho: 1.0, spread: 0.025, phi: false, lt_shift: false, sector: mortgage, cor_segment: retail}
                    # льготная: ключевая + компенсация 2,5 п.п. [НП: rg.ru 31.12.2025 — 2,0 МКД / 2,5 ИЖС; ось 0,020–0,035; первичку собрать]
    retail_loans:   {side: asset, ref: ofz_3y, rho: 0.12, spread: {"2026": 0.02209, "2027": 0.0239, "2028": 0.02785, "2029": 0.03064, "2030": 0.03229, LT: 0.03408, LT_from: 2031}, phi: true, lt_shift: true, sector: retail_other, cor_segment: retail}
                    # потреб + карты + авто [Р: calib-nii]
    securities:     {side: asset, ref: ofz_3y, rho: 0.33, spread: {"2026": -0.01961, "2027": -0.01849, "2028": -0.01604, "2029": -0.0143, "2030": -0.01327, LT: -0.01216, LT_from: 2031}, phi: false, lt_shift: false, balancing: true}
                    # долговые бумаги (FVOCI + АС + СС); a = 0,823, ρ 95 % 0,26–0,40 [Р: calib-nii]; акции и фонды (≈243) — в прочих активах
    liquidity:      {side: asset, ref: key, rho: 1.0, spread: {"2026": -0.07219, "2027": -0.07966, "2028": -0.07954, "2029": -0.07347, "2030": -0.06969, LT: -0.0659, LT_from: 2031}, phi: false, lt_shift: false, balancing: true}
                    # касса, ЦБ, банки, обратное репо; 2026 — по ставке якоря 7,40 % [Р: calib-nii]
    retail_current: {side: liability, ref: key, rho: 0.31, beta: 0.272, spread: -0.00929}   # текущие ФЛ; ρ 95 % 0,15–0,53 [Р: calib-nii 2018К4–2026К2]
    retail_term:    {side: liability, ref: key, rho: 0.37, beta: 0.855, spread: -0.01983}   # срочные ФЛ; ρ 95 % 0,29–0,46 [Р: calib-nii]
    corp_funds:     {side: liability, ref: key, rho: 0.97, beta: 0.709, spread: -0.01496}   # средства ЮЛ; ρ 95 % 0,73–1,00 [Р: calib-nii]
    wholesale:      {side: liability, ref: key, rho: 1.0, beta: 1.0, spread: {"2026": 0.01004, "2027": -0.00275, LT: -0.01555, LT_from: 2028}, balancing: true}
                    # банки, выпущенные бумаги, репо, суборд.; 2К26 — ключевая + 1,00 п.п.; история −1,56 [Р: calib-nii]
  transmission:                                                # явный ключ передачи ставки (MODEL §4.5)
    target: 0.06                                               # A-N3: РЕАЛИЗОВАННАЯ передача [Nss(M) − Nss(N)] / (key_M^LT − key_N^LT), доля на долю;
                                                               #   φ ≈ 0,484 [Р: calib-nii — эмпирика в базисе движка 0,056–0,085; ось 0–0,14]
    reference_world: H                                         # мир, в котором заданы спреды s_b^H и решается σ0 (сжатие φ в нём равно нулю)
    fd_step: 0.01                                              # шаг параллельного сдвига ставок для локальной T(W) (диагностика), доля
    weights: anchor                                            # веса книг стационарного ЧПМ — структура баланса якоря
  nim_lt_target_mgmt: 0.060                                    # A-N2: ЧПМ сквозь цикл при ставках мира H, упр. базис [Р/В: линия 5,395 + 0,0371 × ключевая = 5,78 %
                                                               #   при ключевой H + структурная премия 2025–26 ≈0,1–0,25 п.п.; книги дают 7,25 %; ось 0,054–0,067, решение ведущего]
  retail_current_share:                                        # доля текущих счетов в средствах ФЛ: c*(key) = c_ref − psi·(key − key_ref), подстройка rho за квартал
    c_ref: anchor                                              # доля якоря 14 309,0 / 34 478,5 = 0,415 [Ф: МСФО 6М26 с. 40]
    key_ref: anchor                                            # средняя ключевая 2К26 по календарным дням = 0,14618 [Р: facts/nii_books.json]
    psi: 1.12                                                  # доля на долю ключевой, ст. ош. 0,18 [Р: calib-nii 2022К4–2026К2]
    rho: 0.21                                                  # [Р: calib-nii]
    bounds: [0.35, 0.52]                                       # [В: вокруг наблюдённых 40–50 %, 2022К4–2026К2]
  dia_rate: 0.0052                                             # взносы АСВ / средние средства ФЛ: 87,3 × 365/181 / 33 972 [Р: МСФО 6М26]; 1К23–2К26 — 0,0053

# ------------------------------------------------------------------ ОБЪЁМЫ (A-G*)
volumes:
  guidance_year: 2026                                          # год, рост которого задан гайденсом (MODEL §4.3)
  guidance_growth: {corporate: 0.09, retail: 0.10}             # рост кредитов за 2026 к концу 2025, доли. Корп.: гайденс сектора 8–10 % (Сбер «в соответствии
                                                               #   с сектором») [Ф: презентация 2К26 с. 23]; розн.: гайденс сектора 5–8 %, Сбер «лучше сектора»,
                                                               #   факт +5,6 % за 1П26 (упр.) и +7,4 % за 8М26 (РСБУ) [Ф] → 0,10 [В: решение ведущего]
  loan_share_drift: -0.01                                      # A-G1: дрейф доли Сбера в кредите сектора, доля роста в год [В: VM §9; ось −0,03…+0,01]
  funds_share_drift: 0.0                                       # то же для средств клиентов [В: нейтрально]
  share_drift_until: 2030                                      # последний год дрейфа [В]
  lt_from: 2031                                                # с этого года рост всех объёмов = g_T мира, линейный сход с последнего года надстройки [В]
