                                                               #   2026 [Р]: расходы МСФО 1П26 +15,2 % г/г (639,6 / 555,0) при зарплатах мира H 9,5 %; проверка — гейт CIR
                                                               #   (гайденс 30–32 %); 2027–28 +2 %, далее +0,5 % [В: DESIGN §4]
