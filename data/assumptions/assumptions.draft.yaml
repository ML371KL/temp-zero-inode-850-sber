# ------------------------------------------------------------------ КАПИТАЛ И НОРМАТИВЫ (A-K*b)
# Н1.1 в ядре — ПРОКСИ Н20.1 группы (Н20.1 не раскрывается; надбавки 220-И п. 3.5 — только к Н20.x): пол = 4,5 % + надбавки.
# Соло-пол Н1.1 (4,5 %) не моделируется — не связывает (запас ≥ 5,9 п.п.) [Ф: 220-И; МСФО 6М26 с. 67; calib-capital].
capital:
  minimum: {n20_0: 0.08, n1_1: 0.045}                          # минимум Н20.0 и Н20.1 группы (n1_1 — пол прокси) [Ф: 220-И п. 2.2; 729-П]
  mgmt_buffer: {n20_0: 0.013, n1_1: 0.0}                       # управленческий буфер к полу: 13,3 − 12,0 [Р: DESIGN §3.4; ось 0,008–0,020]; к Н20.1 — не раскрыт [В]
  reg_scenarios:                                               # надбавки по годам (с 1 января), доли RWA [Ф: 220-И пп. 3.2, 3.4; ОФС ЦБ 05.2026 с. 63]
    ids: [schedule, upper, strict]                             # дифференцированная надбавка СЗКО — постепенно, +0,5 п.п. в год с 2029 [В: regulation; решение ведущего];
                                                               #   «сразу с 2029» — вариант для оси
    schedule:
      name: "По графику"
      conservation: {"2026": 0.010, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.010}
      ccyb: {LT: 0.005}                                        # АЦН 0,5 % с 01.07.2025 [Ф]
      deduction_pp:                                            # вычеты, доли норматива: групповая консолидация −0,45 п.п. с 2028 [В: доклад ЦБ 05.02.2026 — до −0,9 п.п.,
        n20_0: {"2027": 0.0, LT: 0.0045, LT_from: 2028}        #   половина нивелируема; ось 0–0,009]; лимит иммобилизованных активов (25 % с 01.01.2031, проект ЦБ [НП]) — 0:
        n1_1: {"2027": 0.0, LT: 0.0045, LT_from: 2028}         #   доля ИА Сбера не раскрыта
    upper:
      name: "Верхняя группа СЗКО"
      conservation: {"2026": 0.010, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.010, "2029": 0.015, LT: 0.020, LT_from: 2030}
      ccyb: {"2027": 0.005, LT: 0.010, LT_from: 2028}
      deduction_pp:
        n20_0: {"2027": 0.0, LT: 0.0045, LT_from: 2028}
        n1_1: {"2027": 0.0, LT: 0.0045, LT_from: 2028}
    strict:
      name: "Жёсткий"
      conservation: {"2026": 0.010, "2027": 0.015, "2028": 0.025}
      sifi: {"2026": 0.005, "2027": 0.0075, "2028": 0.010, "2029": 0.015, "2030": 0.020, LT: 0.025, LT_from: 2031}
      ccyb: {"2027": 0.005, LT: 0.010, LT_from: 2028}
      deduction_pp:
        n20_0: {"2027": 0.0, LT: 0.0045, LT_from: 2028}
        n1_1: {"2027": 0.0, LT: 0.0045, LT_from: 2028}
    # Пол Н20.0 = 8 % + надбавки: 10,0 (2026) → 10,75 (2027) → 12,0 / 12,5 / 12,5 (2028) → 12,0 / 13,0 / 13,0 (2029) → 12,0 / 13,5 / 13,5 (2030)
    #   → 12,0 / 13,5 / 14,0 (2031+); пол Н20.1 (прокси Н1.1) = 4,5 % + те же надбавки [Р].
  n20:                                                         # Н20.0 группы из BV — аддитивные вычеты, растущие с RWA (MODEL §4.11)
    deductions_anchor: 936.7                                   # Ded20_0 = BV обыкн. − CET1 (Базель) = 8 387,2 − 7 450,5 [Р: МСФО 6М26 с. 5, 68]
    fvoci_recognition: 0.77                                    # доля фонда FVOCI, признаваемая в нормативе: доля ОФЗ в корректировке СС 2025 [Р: calib-capital;
                                                               #   ответы ЦБ 646-P-2022/2, 646-P-2020/3; ось 0,65–0,85]
    t2: {LT: 500.3}                                            # капитал 2-го уровня, плоско [Ф: Базель T2 6М26 с. 68; регуляторный T2 группы не раскрыт]
    gap_pp: -0.0012                                            # «Н20.0 − расчёт» на якоре в аддитивной форме: 15,10 − 15,22 п.п. [Р]; история той же формы
                                                               #   2024–2026 +0,16 ± 0,53 п.п. (n = 10), 2025–2026 −0,21 ± 0,29 (n = 6) — вычеты росли быстрее RWA
                                                               #   (НМА); ось −0,005…+0,002
  n11:                                                         # Н1.1 банка (форма 135) — прокси Н20.1 группы (MODEL §4.11)
    deductions_anchor: 1173.8                                  # Ded11_0 = (BVreg − E) − базовый капитал банка = 8 294,3 − 7 120,5 [Р: форма 123 на 01.07.2026; МСФО 6М26]
    gap_pp: -0.0004                                            # воспроизводит Н1.1 банка 11,961 % на 01.07.2026 при RWA группы (7 120,5 / 59 318,1 = 12,004 %) [Р:
                                                               #   форма 135; RWA банка / RWA группы 1,0036 на якоре, 1,016 ± 0,008 в 2К23–2К26]
    audit_cutoffs: [3, 4]                                      # кварталы, прибыль по которые входит в базовый капитал после аудита: 9М — с формы 01.12, год — с 01.04
                                                               #   [Ф: форма 123]; неаудированная E на конец квартала: К1 — К1; К2 — 6М; К3 — 9М; К4 — К4
  rwa:
    density: {corp_loans: 1.031, mortgage: 0.515, mortgage_sub: 0.515, retail_loans: 1.485, securities: 0.155, liquidity: 0.103, other_assets: 1.546}
                                                               # RWA / остаток книги (с распределённым операционным и рыночным риском): априорные веса [В] × масштаб 0,896
                                                               #   к Basel RWA 59 318,1 на 30.06.2026 [Р: calib-capital; МСФО 6М26 с. 68]; розница — средневзвешенно [Р]
    density_drift_rate: 0.005                                  # рост плотности, доля в год (макронадбавки) [В: DESIGN §4; ось 0…0,015]
    density_drift_until: 2029                                  # последний год дрейфа [В: DESIGN §4]
    fx: {enabled: false, share: null, foreign_inflation: null} # валютная переоценка RWA выключена в 1.0: курса в мирах нет, доля Сбера не раскрыта (сектор 11,8–12,9 %) [В]
  recapitalization: {enabled: false}                           # докапитализация/размывание — выключено у Сбера (ключ под ВТБ и др., DESIGN §7)

# ------------------------------------------------------------------ ДИВИДЕНДЫ — ПОЛИТИКА ДАННЫМИ (A-D*)
dividends:
  policy:                                                      # книга 1.0 — Положение 2023 [Ф: dividend_policy_2023.pdf, sha256 f486aa17…; п. 1.6, 2.2–2.3]
    name: "Положение о дивидендной политике ПАО Сбербанк (НС 05.12.2023, прот. № 34)"
    base: ifrs_ni_shareholders                                 # база: ЧП группы по МСФО, приходящаяся на акционеров (альтернатива: ifrs_ni_adjusted)
    deduct_at1_after_tax: true                                 # вычет купонов AT1 за вычетом налогового эффекта (п. 2.3)
    payout: {LT: 0.50}                                         # доля по году прибыли (п. 2.3); ноябрьская политика входит новой версией книги
    metric: n20_0                                              # норматив условия (п. 2.2)
    threshold: 0.133                                           # порог Н20.0 (п. 2.2) = «цель» в требовании max(цель; пол + буфер)
    steps: []                                                  # ступени [{payout, threshold}] по убыванию доли; у политики 2023 — нет
    shortfall_rule: residual_above_requirement                 # не хватает капитала — остаток сверх требований (DESIGN §3.5 п. 7)
    divisor: issued                                            # DPS = пул / размещённые акции обеих категорий (п. 1.6) [Ф: 22 586,948 млн]
    dps_rounding: ceil_kopeck                                  # вверх до копейки: воспроизводит 2023–2025 (33,30 / 34,84 / 37,64) точно [Р: market pool_check; критик]
    forecast_rounding: none                                    # прогнозный DPS не округляется (гладкость поисков)
  payout_deviation: {LT: 0.0}                                  # добровольное отклонение доли, доли [В: DESIGN §4; ось −0,10…0; обратный расчёт −0,5…+0,5]
  excess:
    from_profit_year: 2030                                     # «с 2030» — по году прибыли (политика 2023 — до 2029) [В]
    epsilon: 0.5                                               # доля выплаты избытка над требованием [В: середина между историей (ε ≈ 0) и капиталонейтральной выплатой (ε = 1); ось 0–1]
  crisis: {skip_in_shock_year: true, catch_up: true}           # перенос 100 % выплаты года кризиса, догоняющий полностью [Ф прецедент: за 2021 — 0, за 2022 — 25 ₽];
                                                               #   частичная схема (−50 % / 50 %) — 1.x (≈1,9 ₽ < шага печати)
  buyback: {enabled: false}                                    # выключено (DESIGN §3.5 п. 7)
  calendar:                                                    # кварталы года Y+1
    agm_quarter: 2                                             # МСФО вычитает дивиденд из BV в квартал ГОСА (июнь 2024–2026) [Ф: МСФО 6М26 прим. 11]
    reg_deduction_quarter: 3                                   # квартал ОТСЕЧКИ: регуляторный капитал вычитает дивиденд в месяце отсечки (июль 2024–2026) [Ф: форма 123]
    payment_quarter: 3                                         # выплата — июль–август [Ф: срок выплаты за 2025 год — 03.08.2026]
    checkpoints: [3, 4]                                        # проверка нормативов: после выплаты и на конец следующего отчётного периода (п. 2.2)

bridge:
  declared_dividends: register                                 # объявленный дивиденд до последнего дня покупки — из реестра (живой вход, MODEL §8.1)
  governance_applies: false                                    # мост не несёт дисконта за управление (MODEL §8.2)

# ------------------------------------------------------------------ ОЦЕНКА (A-V*)
valuation:
  beta_e: 0.83                                                 # A-V1: β капитала, недели, полная доходность к MCFTR, окно 3 года [Р: market — 0,826, se 0,053, n 157;
                                                               #   окна 2 года 0,835, 5 лет 0,996 без 24.02–31.03.2022; ось 0,70–1,05]
  erp: 0.0557                                                  # A-V2: Damodaran 01.2026 без двойного странового риска [Ф: решение владельца 30.09; ось 0,049–0,062]
  roll_along_forwards: true                                    # A-V10: перекат по форвардам (MODEL §0.5)
  governance:                                                  # A-V7: дисконт за управление по каналам снизу вверх (как Лента); discount = Σ sign·value
    discount: 0.0                                              # [В: каналы оценивает книга 1.0 с опорами; канал без опоры — 0; ось 0–0,10]
    components:
      - {id: quasi_fiscal, name: "Квазифискальные сделки и сделки со связанными сторонами", value: 0.0, sign: 1, basis: "оценка каналов — книга 1.0; без опоры — 0"}
      - {id: withdrawals, name: "Изъятия сверх налоговой оси", value: 0.0, sign: 1, basis: "налоги, капитал и кризис заданы явно и в дисконт не входят; без опоры — 0"}
      - {id: liquidity_listing, name: "Ликвидность и листинг", value: 0.0, sign: 1, basis: "DESIGN §4: ≈0"}
  terminal:
    real_growth: 0.015                                         # A-V3b: g_real [В: DESIGN §3.5 п. 8; ось 0,005–0,025]
    fade: 1.0                                                  # угасание избыточной доходности (множитель к ROE_T − k_T) [В: DESIGN §4; ось 0,5–1,0]
    excess_capital_multiple: 1.0                               # избыток капитала на T — 1:1 [В: DESIGN §3.5 п. 8]
    timing: year_end                                           # поток терминального года — на конец года (один множитель у RI и DDM, MODEL §7)
  headline:
    print_step: 5                                              # шаг печати, ₽ — число книги (у каждого банка своё): ≈1,8 % цены [В: DESIGN §12.2]
    diagnostics: median                                        # обратный расчёт и «что даст отчёт» — для печатаемой медианы
    search_tol_rub: 0.5                                        # стоп поисков по медиане, ₽ (десятая шага печати)
    jump_guard: {median_pct: 0.08, v0_pct: 0.08}               # защита заголовка, доли цены [В: Лента 0,08 / 0,10; у банка V0 = капитал без рычага]
    ceiling_x_market: 3.0                                      # потолок заголовка, кратных цене главного тикера [В: приём 850oa — потолок ≈3,4 цены]
  sensitivities: {cor_pp: 0.001, nim_pp: 0.001, roe_pp: 0.01}  # шаги строк «₽ за 0,1 п.п. CoR / 0,1 п.п. ЧПМ / 1 п.п. ROE сквозь цикл» (MODEL §8.3)
  uncertainty:                                                 # A-V9 (как 850oa)
    draws: 2000
    seed: 20260930
    quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
    median_draws: 200
    reverse_bounds: follow_center
    median_refine: 1
    axes:                                                      # dist: triangular — треугольное на [low; high] с модой = значению книги (MODEL §10)
      - {name: "ЧПМ сквозь цикл (A-N2)", kind: value, paths: [nii.nim_lt_target_mgmt], low: 0.054, high: 0.067, dist: triangular}              # решение ведущего
      - {name: "Передача ключевой в ЧПМ (A-N3)", kind: value, paths: [nii.transmission.target], low: 0.0, high: 0.14, dist: triangular}        # calib-nii
      - {name: "CoR сквозь цикл (A-C0b, сдвиг LT всех режимов)", kind: shift, paths: [regimes.soft.cor.LT, regimes.norm.cor.LT, regimes.downturn.cor.LT, regimes.crisis.cor.LT], low: -0.003, high: 0.005, dist: triangular}
      - {name: "κ: CoR к реальной ставке сверх мира N (A-C2b)", kind: value, paths: [credit.kappa], low: 0.0, high: 0.15, dist: triangular}   # regimes
      - {name: "Вероятности режимов (P(кризис) 10–25 %)", kind: dict, paths: [joint.regime_prob], low: {soft: 0.1588, norm: 0.4235, downturn: 0.3177, crisis: 0.10}, high: {soft: 0.1324, norm: 0.3529, downturn: 0.2647, crisis: 0.25}, dist: triangular}
                                                               # концы: вероятность кризиса 10 и 25 %, остальные режимы — пропорционально книге [Р]
      - {name: "Кризис: сдвиг ЧПМ 2027", kind: value, paths: [regimes.crisis.nim_shift.2027], low: -0.012, high: 0.0, dist: triangular}     # regimes
      - {name: "Кризис: разовый убыток", kind: value, paths: [regimes.crisis.one_off_loss.amount], low: -1000.0, high: 0.0, dist: triangular} # regimes: 0–12 % капитала
      - {name: "Компенсация льготной ипотеки", kind: value, paths: [nii.books.mortgage_sub.spread], low: 0.020, high: 0.035, dist: triangular}
      - {name: "Доля текущих счетов: чувствительность к ключевой (ψ)", kind: value, paths: [nii.retail_current_share.psi], low: 0.94, high: 1.30, dist: triangular}   # ± ст. ош.
      - {name: "ЧКД: рост к зарплатам мира", kind: shift, paths: [fees.growth_vs_wages], low: -0.02, high: 0.03, dist: triangular}               # DESIGN §4
      - {name: "Расходы: реальный рост", kind: shift, paths: [opex.real_growth], low: -0.005, high: 0.025, dist: triangular}                     # DESIGN §4
      - {name: "Непрофильный результат (LT, цены 2026)", kind: value, paths: [noncore.result_real.LT], low: -150.0, high: 0.0, dist: triangular} # DESIGN §4
