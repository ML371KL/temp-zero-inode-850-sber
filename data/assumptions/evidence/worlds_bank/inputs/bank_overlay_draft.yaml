meta:
  status: 'пересборка миров 1.7, 29.10.2026 (этап 1 канона: база — прогноз ЦБ 23.10.2026, сценарии — итоговая ОНДКП 28.10.2026, запись миров 1.7);
    в книгу — решением автора книги'
  units: '% г/г; [низ, верх] — диапазон ЦБ; середина — mid()'
  worlds_record: {path: 'worlds_source.json', sha256: 1e905cb77c1d3a81cc89d6b80769171a60c0169d103340d3e7314bd8030d6f00,
    asof: '2026-10-28'}
  sources:
    ondkp: {file: 'primary/forecast_261023.pdf', url: 'https://www.cbr.ru/Content/Document/File/198897/forecast_261023.pdf',
      sha256: 0e007c6d0d654b9ada9beb10ea7a6cec66d3973385fb7795677db095dd8e9cb2, note: 'база надстройки — «Среднесрочный прогноз Банка России по
        итогам заседания Совета директоров по ключевой ставке 23 октября 2026 года», с. 1 (сноска ¹: средняя КС 01.01–25.10.2026 = 14,7 %, 26.10–31.12.2026
        — 14,0 %); те же числа — табл. 3.2 итоговой ОНДКП 28.10.2026 (PDF-с. 73). Ключ блока — ondkp, как читает build_overlay.py'}
    ondkp_final: {file: 'primary/ondkp_2027_2029_final.pdf', url: 'https://www.cbr.ru/Content/Document/File/197907/on_2027(2028-2029).pdf',
      sha256: 7e3b29af616175fd33324aed85d446c4f55e5b7c3c34c938a12610bb65a4a6a9, note: 'итоговая ОНДКП 2027–2029 от 28.10.2026: альтернативные
        сценарии — табл. 3.3–3.5 (PDF-с. 77 / 81 / 85); проект 30.09.2026 — sha256 3c3270ef…'}
    bank_review: {file: 'primary/cbr_bs_review_2026q2.pdf', url: 'https://www.cbr.ru/Collection/Collection/File/62347/analytical_review_bs-2026-2.pdf',
      sha256: ed4826f87f33741defd797d1c53f7da5ebf28c0944264fed9d4d965e268e5f4e}
    hh_mortgage_weight: {value: 0.5806, asof: '2026-08-01', basis: 'задолженность по кредитам ФЛ-резидентам: ИЖК 21 723 362 / всего 37 413 036
        млн ₽', source: 'cbr.ru/dataservice pub 20/ds 42 и pub 21/ds 46, measure 22 (РФ); stage1/worlds/cbr_dataservice_hh_loans_2026.json'}
  conventions: ['Требования банковской системы к экономике — по сноске ³ табл. 3.2 (кредиты, бумаги, участие; без валютной переоценки); «к населению»
      включает ИЖК.', Ставки и инфляция миров берутся ТОЛЬКО из записи миров (worlds_source.json); ключевая и ИПЦ ОНДКП здесь — справочно и для
      пересчёта., 'N = базовый сценарий как есть. H, M = реальный рост базы × инфляция мира: g_w = (1+g_base)·(1+π_w)/(1+π_N) − 1; π — средний
      ИПЦ мира за год (среднее полугодий cpi_yoy_avg); 2026 — одинаково во всех мирах (год почти прожит).', 'Кризисный режим = рисковый сценарий
      (табл. 3.5) как есть; ставка рискового сценария (КС 19–21 % в 2027) в миры НЕ переносится — гейт «M × кризис» сверяет CoR, рост кредита
      и нормативы.', 'Номинальный ВВП — прокси: (1 + реальный ВВП)·(1 + средний ИПЦ) − 1 (дефлятора в таблице нет).', 'После 2029 [В]: рост требований
      линейно от 2029 к номинальному ВВП мира (2,0 % реально × LT-инфляция мира) к 2031, далее постоянно (кредит/ВВП стабилен).', 'Альтернатива
      для H (не принята): реальный рост проинфляционного сценария (табл. 3.4) вместо базового — ниже в 2027–2028 на 2–3 п.п.', «Прочая розница»
      2026–2027 — прогноз по балансам из обзора «Банковский сектор. II кв. 2026» (собран на прогнозе 24.07.2026); новее обзора на 29.10.2026 нет.]
  overlay: {as_of: '2026-10-23', recipe: 'N — середины диапазонов базового сценария Банка России: среднесрочный прогноз 23.10.2026 (forecast_261023.pdf,
      с. 1, sha256 0e007c6d…; те же числа — табл. 3.2 итоговой ОНДКП 2027–2029 от 28.10.2026, PDF-с. 73), кроме «прочей розницы» 2026–2027 — прогноз
      ЦБ по балансам («Банковский сектор. II кв. 2026», PDF-с. 20 / печ. 19, sha256 ed4826f8…) и 2028–2029 — [Р] (население − w·ИЖК)/(1 − w),
      w = 0,5806 (доля ИЖК в задолженности ФЛ на 01.08.2026, dataservice ЦБ). H и M — реальный рост базы при инфляции своего мира: g_W = (1 +
      g_N)·(1 + π_W)/(1 + π_N) − 1, π — средний ИПЦ мира за год по записи миров семейства 1.7 (worlds_source.json, sha256 1e905cb7…); 2026 — одинаково
      во всех мирах. credit_growth.corporate — «организации», mortgage — ИЖК, retail_other — «прочая розница»; funds_growth.retail = funds_growth.corporate
      = М2 (раздельных рядов нет); nominal_gdp_growth — справочно. Середины диапазонов → доли. Годы 2026–2029; после 2029 ядро сводит рост объёмов
      к g_T мира к volumes.lt_from (MODEL §4.3). Сборщик — data/assumptions/evidence/worlds_bank/build_overlay.py; вход — черновик надстройки
      (evidence/worlds_bank/inputs/bank_overlay_draft.yaml).'}
