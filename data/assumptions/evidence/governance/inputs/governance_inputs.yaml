  imoex_weight: {value: 0.14, src: "[НП] вес в индексе МосБиржи для справочного «рынка без Сбера» (лист beta этапа 1)"}
  window: {from: "2025-09-30", to: "2026-09-29"}              # 12 месяцев до даты рынка листа beta
  prices_file: ../beta/inputs/stage1/market/beta/inputs/prices_SBER.csv   # MOEX ISS TQBR: VALUE — оборот дня, ₽
  treasury_ordinary_mln: 209.9       # собственные обыкновенные на отсечку 20.07.2026 (evidence/dividends: 7,9 / 37,64)
