# Опоры каналов дисконта за управление (книга 1.3; выписки из первички — документ, страница PDF, sha256).
# Деньги — млрд ₽. Пути документов — от папки передачи ($BANK_HANDOFF_DIR); сами PDF в репозиторий не кладутся.
documents:
  ifrs_6m26: {file: research/primary/2026H1_ifrs_interim_statements.pdf, sha256: 5b3a3de88ae6c96b6441054cd8e65dd5e45c170666d6d493534c400cdcd01a08}
  ifrs_fy2025: {file: primary/ifrs_FY2025_statements.pdf, sha256: eb4e9c7919500f3d8d869c2041473a91c6f3765d739f65ff5d8d85b9850cad4c}
  ifrs_fy2024: {file: primary/ifrs_FY2024_statements.pdf, sha256: fbd4d739ce58c597b40fe1ea1c240fd6dcdaeb93ae455310c72f3600b6123ba1}

# (а) Квазифискальные сделки и сделки со связанными сторонами
quasi_fiscal:
  deals:                             # покупки долей не по профилю банка, раскрытые в МСФО 2024, 2025 и 6М26 (других нет)
    - {what: "41,9 % акций ведущего отечественного производителя микроэлектроники и полупроводников", when: "2026-01", amount: 27.0,
       src: "ifrs_6m26, прим. 1, PDF-с. 11; ifrs_fy2025, прим. 43 «События после отчётного периода», PDF-с. 170"}
    - {what: "ещё 7,9 % в обязательном предложении (ст. 84.2 208-ФЗ)", when: "2026-05", amount: 5.4,
       src: "ifrs_6m26, прим. 1, PDF-с. 11"}
  window: {from: "2024-01-01", to: "2026-06-30", years: 2.5}   # охват просмотренной отчётности: МСФО 2024, 2025, 6М26
  loss_share: {center: 0.25, low: 0.0, high: 1.0}             # [В] доля цены, не возвращаемая банку: между «рыночными условиями»
                                                              #   (прим. о связанных сторонах; цена обязательного предложения — не
                                                              #   ниже рыночной по закону) и полной передачей стоимости
  related_party_note: "ifrs_fy2025, прим. 39, PDF-с. 155: операции с государством и компаниями, связанными с ним, — «обычно на рыночных условиях»; субординированные займы Банка России 349,1 (прим. 21) — в пользу банка"

  # Перевод рублёвого канала в долю капитала модели V0 печатаемой медианы неподвижной точкой (MODEL §8.2; решения
  # ведущего В5 и В16): g = PV / V0(g), V0 × (1 − g) × 1000 / N_out = медиана (мост и объявленный дивиденд на дату книги — 0).
  # Ключ книги — точка, округлённая к шагу; лист отказывает, если ключ отстоит от точки больше чем на половину шага.
  fixed_point:
    median_rub: 348.60               # точная медиана результатов книги 1.3 (results.json); ключ 0,004
                                     #   выбран по точке на медиане книги 1.2 (371,45 ₽: 0,380 %) и на своей медиане остаётся в шаге
    median_of: "книга 1.3"           # чьи результаты: версия книги в results.json на момент пересчёта
    shares_outstanding_mln: 22342.5  # акции в обращении обеих категорий на якоре (data/facts/shares.json)
    step: 0.0005                     # шаг ключа книги — 0,05 п.п.: ключ не меняется от рубля медианы

# (б) Изъятия сверх налоговой оси
withdrawals:
  windfall_tax_2023: {amount: 2.5, src: "ifrs_fy2024, прим. 28 «Налог на прибыль», PDF-с. 84: «Расходы по „налогу на сверхприбыль“» за 2023 г."}
  bv_common_2023_end: {amount: 6434.0, src: "капитал обыкновенных акционеров 31.12.2023 (лист capital, bv_to_capital, МСФО 2023)"}
  unclaimed_dividends_restored_2026: {amount: 55.3, src: "ifrs_6m26, прим. 11, PDF-с. 43: невостребованные дивиденды за 2022 г. восстановлены в нераспределённой прибыли (в пользу акционеров)"}

# (в) Ликвидность и листинг
liquidity:
