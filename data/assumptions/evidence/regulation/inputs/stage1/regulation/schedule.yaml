    values: {'2025-02-01': 0.25, '2025-07-01': 0.5}
    current: 0.5
    target_neutral: 1.0
    source: 'страница ЦБ «Национальная антициклическая надбавка» (снимок 30.09.2026); пресс-релиз 08.11.2024: «до целевого уровня в 1% от активов, взвешенных
      по риску»; пресс-релиз 27.07.2026: 0,5 сохранена, «признаков кредитного перегрева не наблюдается»'
    decisions_rhythm: ежеквартально с макропакетом (30.01, 29.04, 27.07.2026); следующее — ориентировочно конец октября 2026 [НП]
    crisis: распускается в случае кризиса (страница ЦБ); макробуфер сектора 1,3 трлн ₽ (ОФС май 2026) тоже может быть распущен
  group_only: 'Головные КО банковских групп соблюдают надбавки только на консолидированной основе (220-И п. 3.5, абз. 1) → у банка соло пол Н1.x = минимум;
    надбавки — к Н20.x группы. Подтверждение: МСФО 6М26 прим. 18 (с. 67): «Н1.0 Банка … не менее 8,0%», «Н20.0 с учётом максимальных надбавок … не менее
    12,0%».'
distribution_rule:
  source: 220-И п. 3.5, абз. 2 и таблица
  measure: фактическая сумма надбавок = min(Н20.1 − 4,5; Н20.2 − 6; Н20.0 − 8) (для группы; у соло-банка — по Н1.x)
  bands:
  - {if: 'сумма надбавок ≤ минимума периода (пп. 3.2, 3.4 для года + АЦН)', distributable_share_of_profit: 0}
  - {if: 'между минимумом периода и значениями графы 5 (2,5 + 1,0 + АЦН)', distributable_share_of_profit: 50 % прибыли текущего и предыдущего года; 0 —
      прибыли прошлых лет}
  - {if: больше значений графы 5, distributable_share_of_profit: 100}
  model_note: 'До 2028 выплата 50 % разрешена уже при Н20.0 выше пола года (10,0 % в 2026, 10,75 % в 2027); 100 % — при Н20.0 > 12,0 % (АЦН 0,5). С 2028
    полосы сливаются. Для дифф. надбавок СЗКО графа 5 не определена — принято: порог = пол года [В].'
policy: {sber_N20_0_target: 13.3, source: 'дивполитика 05.12.2023, п. 2.2–2.3 (research/primary/dividend_policy_2023.pdf, с. 3–4): не менее 13,3 % при надбавке
    СЗКО ≤ 1,0, поддержания ≤ 2,5 и АЦН 0 %; срок действия — 3 года (п. 6.4) → до 05.12.2026', mgmt_buffer_center: 1.3, mgmt_buffer_note: '1,3 = 13,3 −
