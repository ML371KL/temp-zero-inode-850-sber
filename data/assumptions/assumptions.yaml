# МАШИННАЯ КНИГА — собрана build_assumptions.py из assumptions_template.yaml, worlds_source.json и worlds_bank.json; руками не править.
# Книга допущений Сбербанка (850-sber) — ШАБЛОН машинной книги, версия 1.3 (запись версии в журнале — 02.10.2026;
# дата книги meta.date — 30.09.2026: день цены, кривых и оценки, на которых книга собрана, один у версий 1.0–1.3).
# Из шаблона data/assumptions/build_assumptions.py собирает машинную книгу assumptions.yaml (+ .json): вписывает миры семейства
# (worlds.N|H|M — на место строки-метки WORLDS в блоке worlds), банковскую надстройку (worlds_bank — строка-метка WORLDS_BANK)
# и её sha256 (метка OVERLAY_SHA256). Правят шаблон;
# машинную книгу — только сборкой. Основа шаблона — черновик assumptions.draft.yaml (схема и числа решений 01.10.2026);
# текст и обоснования — ASSUMPTIONS-BOOK.md (идентификаторы A-xx те же), расчёты — evidence/<область>/.
# Схема ключей — полная (docs/MODEL.md, приложение A); значения — книги 1.3: книга 1.0 (решения ведущего 01.10.2026 и сводка
# этапа 1, §5), решения ведущего по итогам этапа 2 (A1, A3, A4, A8–A10; журнал — V1.1-CHANGES.md), по аудиту после
# волны W1 (В1–В8; журнал — V1.2-CHANGES.md) и по аудиту после волны W2 (В12–В16, В20; журнал — V1.3-CHANGES.md).
# Метки в комментариях:
#   [Ф]  — факт с источником; [Р] — расчёт по фактам; [В] — суждение (DESIGN, этап 1 или автор книги);
#   [НП] — не проверено по первичке (вторичный источник).
#   Метка с текстом после двоеточия у ключа, на котором стоит ось полосы, — ИСТОЧНИК СУЖДЕНИЯ ДЛЯ ВИТРИНЫ: выпуск печатает
#   этот текст как есть (не длиннее 80 знаков). Поэтому он написан словами для владельца: без имён листов, ключей и
#   рабочих пометок, даты — с годом, версии — с именем; у такого ключа метка с текстом одна, прочие пояснения — вне меток.
#   null — только там, где ядро ключ не читает: выключенный блок (`enabled: false` или названный выключатель, MODEL прил. A)
#          или хэш файла, который строит сборка книги; в читаемом пути null — отказ BookError (null ≠ 0).
#   "anchor" — значение выводится из фактов якоря (data/facts/*.json) при загрузке книги (формула — MODEL прил. A).
# Единицы: деньги — млрд ₽; акции — млн шт.; ставки, темпы, доли — доли единицы, годовые; п.п. — тоже доли (0,001 = 0,1 п.п.).
# Траектории: {ключ: значение}; ключи "2026Q3" (квартал), "2026H2" (полугодие), "2027" (год), LT и LT_from (год выхода на LT).
# Правило чтения — docs/MODEL.md §0.4. Незнакомый ключ — отказ BookError (закрытая схема).
# Источники: DESIGN — проект модели v0.3; этап 1 — листы и отчёты калибровок (calib-nii, calib-capital, regimes, market,
#   regulation, mgmt, ifrs; сводка критика §5); воспроизводимые расчёты книги — evidence/<область>/ (README там же).

meta:
  version: "1.3"
  date: "2026-09-30"                 # дата книги: день цены и оценки, на которых она собрана (её печатает выпуск: «книга от …»);
                                     #   у версий 1.0–1.3 она одна — версии меняют суждения, а не день цены; день записи версии — журнал
  facts_date: "2026-06-30"           # отчётная дата якоря (МСФО 6М26)
  anchor_period: "2026Q2"            # последний отчётный квартал
  first_period: "2026Q3"             # первый прогнозный квартал
  last_period: "2036Q4"              # последний квартал явного участка; терминал — с 2037
  valuation_date: "2026-09-30"       # дата оценки книги = дата рыночной цены книги
  curve_as_of: "2026-09-18"          # дата кривых миров (запись magnit-850oa book-1.6); перекат — MODEL §0.5
  market_price: {SBER: 272.87, SBERP: 273.77}   # ₽, ISS LAST 30.09.2026 15:05 МСК [Ф] — цена книги (регрессия results.json)
  basis: "МСФО группы ПАО Сбербанк"  # базис строк движка; упр. метрики — через мост facts/bridge_mgmt_ifrs.json
  step: quarter                      # шаг ядра
  day_count: act365                  # начисление процентов: ставка × остаток × дни/365 (MODEL §0.3)
  company:                           # единственный дом литералов эмитента (тест на литералы в model/, indicators/, web/)
    name: "Сбербанк"
    tickers: [SBER, SBERP]           # SBER — главный (герой витрины), SBERP — вторая линия рынка
    main_ticker: SBER
    share_classes: {SBER: ordinary, SBERP: preferred}   # класс акций тикера: Cap и акции в обращении по классу (MODEL §8.3)
    cbr_regnum: 1481                 # рег. № ЦБ (формы 101/102/123/135)
    fiscal_year_end: "12-31"

