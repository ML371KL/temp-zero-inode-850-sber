                                                               #   [Ф: форма 123]; неаудированная E на конец квартала: К1 — К1; К2 — 6М; К3 — 9М; К4 — К4
  rwa:
    density: {corp_loans: 1.031, mortgage: 0.515, mortgage_sub: 0.515, retail_loans: 1.485, securities: 0.155, liquidity: 0.103, other_assets: 1.546}
                                                               # RWA / остаток книги (с распределённым операционным и рыночным риском): априорные веса [В] × масштаб 0,896
                                                               #   к Basel RWA 59 318,1 на 30.06.2026 [Р: calib-capital; МСФО 6М26 с. 68]; розница — средневзвешенно [Р]
    density_drift_rate: 0.005                                  # рост плотности, доля в год (макронадбавки) [В: суждение книги — надбавки Банка России повышают веса риска]
                                                               #   ось 0…1,5 % в год
    density_drift_until: 2029                                  # последний год дрейфа [В: DESIGN §4]
    fx: {enabled: false, share: null, foreign_inflation: null} # валютная переоценка RWA выключена в 1.0: курса в мирах нет, доля Сбера не раскрыта (сектор 11,8–12,9 %) [В]
  recapitalization: {enabled: false}                           # докапитализация/размывание — выключено у Сбера (ключ под ВТБ и др., DESIGN §7)

# ------------------------------------------------------------------ ДИВИДЕНДЫ — ПОЛИТИКА ДАННЫМИ (A-D*)
dividends:
  policy:                                                      # книга 1.0 — Положение 2023 [Ф: dividend_policy_2023.pdf, sha256 f486aa17…; п. 1.6, 2.2–2.3]
    name: "Положение о дивидендной политике ПАО Сбербанк (НС 05.12.2023, прот. № 34)"
    base: ifrs_ni_shareholders                                 # база: ЧП группы по МСФО, приходящаяся на акционеров (альтернатива: ifrs_ni_adjusted)
    deduct_at1_after_tax: true                                 # вычет купонов AT1 за вычетом налогового эффекта (п. 2.3)
    payout: {LT: 0.50}                                         # доля по году прибыли (п. 2.3); ноябрьская политика входит новой версией книги
    metric: n20_0                                              # норматив условия (п. 2.2)
    threshold: 0.133                                           # порог Н20.0 (п. 2.2) = «цель» в требовании max(цель; пол + буфер)
    steps: []                                                  # ступени [{payout, threshold}] по убыванию доли; у политики 2023 — нет
    shortfall_rule: residual_above_requirement                 # не хватает капитала — остаток сверх требований (DESIGN §3.5 п. 7)
    divisor: issued                                            # DPS = пул / размещённые акции обеих категорий (п. 1.6) [Ф: 22 586,948 млн]
    dps_rounding: ceil_kopeck                                  # вверх до копейки: воспроизводит 2023–2025 (33,30 / 34,84 / 37,64) точно [Р: market pool_check; критик]
    forecast_rounding: none                                    # прогнозный DPS не округляется (гладкость поисков)
  payout_deviation: {LT: 0.0}                                  # добровольное отклонение доли, доли [В: суждение книги; в 2023–2025 годах банк платил по политике]
                                                               #   ось −10…0 п.п.; обратный расчёт −50…+50 п.п.
  excess:
    from_profit_year: 2030                                     # «с 2030» — по году прибыли (политика 2023 — до 2029) [В]
    epsilon: 0.5                                               # доля выплаты избытка над требованием [В: середина между историей (избыток не выплачивался) и полной выплатой избытка]
                                                               #   история — ε ≈ 0, капиталонейтральная выплата — ε = 1; ось 0–1
    ramp_years: 3                                              # A-D3: линейный ввод ε за 3 года — ε/3, 2ε/3, ε за прибыль 2030, 2031, 2032 (MODEL §5.3 п. 4):
                                                               #   накопленный к 2030 избыток выпускается не разом [В: решение ведущего A4]
  crisis: {skip_in_shock_year: true, catch_up: true}           # перенос 100 % выплаты года кризиса, догоняющий полностью (прецедент: за 2021 — 0, за 2022 — 25 ₽);
                                                               #   частичная схема (−50 % / 50 %) — 1.x (≈1,9 ₽ < шага печати)
  buyback: {enabled: false}                                    # выключено (DESIGN §3.5 п. 7)
  calendar:                                                    # кварталы года Y+1
    agm_quarter: 2                                             # МСФО вычитает дивиденд из BV в квартал ГОСА (июнь 2024–2026) [Ф: МСФО 6М26 прим. 11]
    reg_deduction_quarter: 3                                   # квартал ОТСЕЧКИ: регуляторный капитал вычитает дивиденд в месяце отсечки (июль 2024–2026) [Ф: форма 123]
    payment_quarter: 3                                         # выплата — июль–август [Ф: срок выплаты за 2025 год — 03.08.2026, история дивидендов фактов]
    checkpoints: [3, 4]                                        # проверка нормативов: после выплаты и на конец следующего отчётного периода (п. 2.2)

bridge:
  declared_dividends: register                                 # объявленный дивиденд до последнего дня покупки — из реестра (живой вход, MODEL §8.1)
  governance_applies: false                                    # мост не несёт дисконта за управление (MODEL §8.2)

# ------------------------------------------------------------------ ОЦЕНКА (A-V*)
valuation:
  beta_e: 0.83                                                 # A-V1: β капитала, недели, полная доходность к MCFTR, окно 3 года [Р: недельная доходность акций против индекса Мосбиржи полной доходности, 3 года]
                                                               #   0,826, ст. ош. 0,053, n 157; окна 2 года 0,835, 5 лет 0,996 без 24.02–31.03.2022; ось 0,70–1,05
  erp: 0.0557                                                  # A-V2: без двойного странового риска [Ф: премия за риск по Дамодарану на январь 2026 года; решение владельца 30.09.2026]
                                                               #   ось 4,9–6,2 %
  roll_along_forwards: true                                    # A-V10: перекат по форвардам (MODEL §0.5)
  governance:                                                  # A-V7: дисконт за управление по каналам снизу вверх (как Лента); discount = Σ sign·value
    discount: 0.004                                            # Σ каналов, доля V0 печатаемой медианы [Р: потери от сделок в интересах государства, отнесённые к оценке капитала]
                                                               #   канал (а): PV 31,6 млрд ₽ к V0 медианы неподвижной точкой — 0,40 % (на медиане книги 1.2 — 0,38 %), к шагу 0,05 п.п. — 0,4 %;
                                                               #   (б), (в) — 0; ось 0–10 %; лист evidence/governance; решение ведущего В16
    components:
      - {id: quasi_fiscal, name: "Квазифискальные сделки и сделки со связанными сторонами", value: 0.004, sign: 1, basis: "покупка 49,8 % производителя микроэлектроники за 32,4 млрд ₽ (отчётность МСФО за 6 месяцев 2026 года, примечание 1): такие покупки — около 13 млрд ₽ в год за 2024 год — 1-е полугодие 2026 года; потеря четверти цены (оценка), повторяясь каждый год, стоит около 32 млрд ₽ — 0,40 % оценки капитала на медиане выпуска, с округлением к шагу 0,05 п.п. — 0,4 %"}
      - {id: withdrawals, name: "Изъятия сверх налоговой оси", value: 0.0, sign: 1, basis: "измерено: налог на сверхприбыль 2023 года — 2,5 млрд ₽ (отчётность МСФО за 2024 год, примечание 28); он и налоговый риск учтены отдельными осями «Налог: сдвиг ставки» и «Разовый налог: вероятность»; других изъятий нет"}
      - {id: liquidity_listing, name: "Ликвидность и листинг", value: 0.0, sign: 1, basis: "первый уровень листинга, вес в индексе Мосбиржи около 14 %, медианный оборот обыкновенных акций около 7,5 млрд ₽ в день за 12 месяцев к 29.09.2026 — самая ликвидная акция рынка"}
  terminal:
    real_growth: 0.015                                         # A-V3b: g_real [В: суждение книги; потенциальный рост экономики по Банку России — 1,5–2,5 %]
                                                               #   ось 0,5–2,5 %
    fade: 1.0                                                  # A-V4: угасание избыточной доходности — множитель к max(ROE_T − k_T, 0): одностороннее, при ROE_T < k_T
                                                               #   не действует (MODEL §7; решение ведущего В13) [В: суждение книги — конкуренция сжимает доходность сверх стоимости капитала]
                                                               #   ось 0,5–1,0: риск только вниз
    excess_capital_multiple: 1.0                               # избыток капитала на T — 1:1 [В: DESIGN §3.5 п. 8]
    timing: year_end                                           # поток терминального года — на конец года (один множитель у RI и DDM, MODEL §7)
  headline:
    print_step: 5                                              # шаг печати, ₽ — число книги (у каждого банка своё): ≈1,8 % цены [В: DESIGN §12.2]
    diagnostics: median                                        # обратный расчёт и «что даст отчёт» — для печатаемой медианы
    search_tol_rub: 0.5                                        # стоп поисков по медиане, ₽ (десятая шага печати)
    jump_guard: {median_pct: 0.08, v0_pct: 0.08}               # защита заголовка, доли цены [В: Лента 0,08 / 0,10; у банка V0 = капитал без рычага]
    ceiling_x_market: 3.0                                      # потолок заголовка, кратных цене главного тикера [В: приём 850oa — потолок ≈3,4 цены]
  sensitivities: {cor_pp: 0.001, nim_pp: 0.001, roe_pp: 0.01, rank_window: [0.40, 0.60]}
                                                               # A-V13: шаги строк «₽ за 0,1 п.п. CoR / 0,1 п.п. ЧПМ / 1 п.п. ROE сквозь цикл» (MODEL §8.3); rank_window —
                                                               #   окно рангов срединных прогонов оценщика сдвига медианы (MODEL §10): квантили 0,40–0,60
  uncertainty:                                                 # A-V9 (как 850oa)
    draws: 2000
    seed: 20260930
    quantiles: [0.10, 0.25, 0.50, 0.75, 0.90]
    median_draws: 200
    reverse_bounds: follow_center
    median_refine: 2                                           # шагов уточнения корня обратного расчёта на полной полосе: невязка строки не больше стопа search_tol_rub (MODEL §11)
    axes:                                                      # все оси книги — в полосе (решение ведущего В1; MODEL §10). dist: triangular — положение s
                                                               #   треугольно на [−1; 1] с модой 0, значение линейно по половинам от книги до low и до high: медиана и мода —
                                                               #   значение книги, асимметричный диапазон сдвигает среднее (сдвиг положения оси). unit — единица значения оси
                                                               #   для печати (код PAYLOAD §0.2): pct — доля в процентах, pp — сдвиг доли в п.п., number — коэффициент,
                                                               #   years — годы, bn — млрд ₽; у осей-словарей единицы нет
      - {name: "ЧПМ сквозь цикл (A-N2)", kind: value, paths: [nii.nim_lt_target_mgmt], low: 0.054, high: 0.067, dist: triangular, unit: pct}
      - {name: "Передача ключевой в ЧПМ (A-N3)", kind: value, paths: [nii.transmission.target], low: 0.0, high: 0.14, dist: triangular, unit: number}
      - {name: "CoR сквозь цикл (A-C0b, сдвиг LT всех режимов)", kind: shift, paths: [regimes.soft.cor.LT, regimes.norm.cor.LT, regimes.downturn.cor.LT, regimes.crisis.cor.LT], low: -0.003, high: 0.005, dist: triangular, unit: pp}
      - {name: "κ: CoR к реальной ставке сверх мира N (A-C2b)", kind: value, paths: [credit.kappa], low: 0.0, high: 0.15, dist: triangular, unit: number}
      - {name: "Вероятности режимов (P(кризис) 10–25 %)", kind: dict, paths: [joint.regime_prob], low: {soft: 0.1588, norm: 0.4235, downturn: 0.3177, crisis: 0.10}, high: {soft: 0.1324, norm: 0.3529, downturn: 0.2647, crisis: 0.25}, dist: triangular}
                                                               # концы: вероятность кризиса 10 и 25 %, остальные режимы — пропорционально книге (A-P2b)
      - {name: "Кризис: сдвиг ЧПМ 2027", kind: value, paths: [regimes.crisis.nim_shift.2027], low: -0.012, high: 0.0, dist: triangular, unit: pp}
      - {name: "Кризис: разовый убыток", kind: value, paths: [regimes.crisis.one_off_loss.amount], low: -1000.0, high: 0.0, dist: triangular, unit: bn}   # 0–12 % капитала (A-C6b)
      - {name: "Компенсация льготной ипотеки", kind: value, paths: [nii.books.mortgage_sub.spread], low: 0.020, high: 0.035, dist: triangular, unit: pp}
      - {name: "Доля текущих счетов: чувствительность к ключевой (ψ)", kind: value, paths: [nii.retail_current_share.psi], low: 0.94, high: 1.30, dist: triangular, unit: number}   # ± ст. ош.
      - {name: "ЧКД: рост к зарплатам мира", kind: shift, paths: [fees.growth_vs_wages], low: -0.02, high: 0.03, dist: triangular, unit: pp}
      - {name: "Расходы: реальный рост 2026–2030", kind: shift, paths: [opex.real_growth.2026, opex.real_growth.2027, opex.real_growth.2028, opex.real_growth.2029, opex.real_growth.2030], low: -0.005, high: 0.025, dist: triangular, unit: pp}
                                                               # сдвиг явного участка роста — конец роста с 2031 (A8) ось не трогает
      - {name: "Непрофильный результат (LT, цены 2026)", kind: value, paths: [noncore.result_real.LT], low: -150.0, high: 0.0, dist: triangular, unit: bn}
      - {name: "Прочее ОПУ (цены 2026)", kind: value, paths: [other.misc_net_real.LT], low: -300.0, high: -100.0, dist: triangular, unit: bn}
      - {name: "Налог: сдвиг ставки", kind: shift, paths: [tax.statutory], low: 0.0, high: 0.03, dist: triangular, unit: pp}
      - {name: "Разовый налог: вероятность", kind: value, paths: [tax.one_off.prob], low: 0.0, high: 0.30, dist: triangular, unit: pct}
      - {name: "Дюрация FVOCI", kind: value, paths: [oci.fvoci_duration], low: 1.6, high: 2.4, dist: triangular, unit: years}
      - {name: "Срок подтягивания FVOCI", kind: value, paths: [oci.fvoci_maturity], low: 3.0, high: 6.0, dist: triangular, unit: years}
      - {name: "Признание фонда FVOCI в нормативе", kind: value, paths: [capital.n20.fvoci_recognition], low: 0.65, high: 0.85, dist: triangular, unit: pct}
      - {name: "Поправка Н20.0 («норматив − расчёт»)", kind: value, paths: [capital.n20.gap_pp], low: -0.005, high: 0.002, dist: triangular, unit: pp}
      - {name: "Вычеты капитала (групповая консолидация)", kind: value, paths: [capital.reg_scenarios.schedule.deduction_pp.n20_0.LT, capital.reg_scenarios.schedule.deduction_pp.n1_1.LT, capital.reg_scenarios.upper.deduction_pp.n20_0.LT, capital.reg_scenarios.upper.deduction_pp.n1_1.LT, capital.reg_scenarios.strict.deduction_pp.n20_0.LT, capital.reg_scenarios.strict.deduction_pp.n1_1.LT], low: 0.0, high: 0.009, dist: triangular, unit: pp}
      - {name: "Управленческий буфер к полу Н20.0", kind: value, paths: [capital.mgmt_buffer.n20_0], low: 0.008, high: 0.020, dist: triangular, unit: pp}
      - {name: "Дрейф плотности RWA", kind: value, paths: [capital.rwa.density_drift_rate], low: 0.0, high: 0.015, dist: triangular, unit: pct}
      - {name: "Дрейф доли кредитов", kind: value, paths: [volumes.loan_share_drift], low: -0.03, high: 0.01, dist: triangular, unit: pp}
      - {name: "Отклонение выплаты от политики", kind: shift, paths: [dividends.payout_deviation], low: -0.10, high: 0.0, dist: triangular, unit: pp}
      - {name: "Выплата избытка ε с 2030", kind: value, paths: [dividends.excess.epsilon], low: 0.0, high: 1.0, dist: triangular, unit: pct}
      - {name: "Дисконт за управление", kind: value, paths: [valuation.governance.discount], low: 0.0, high: 0.10, dist: triangular, unit: pct}   # каналы — пропорционально (A10)
      - {name: "β_E", kind: value, paths: [valuation.beta_e], low: 0.70, high: 1.05, dist: triangular, unit: number}
      - {name: "ERP", kind: value, paths: [valuation.erp], low: 0.049, high: 0.062, dist: triangular, unit: pct}
      - {name: "Реальный рост терминала", kind: value, paths: [valuation.terminal.real_growth], low: 0.005, high: 0.025, dist: triangular, unit: pct}
      - {name: "Угасание избыточной доходности", kind: value, paths: [valuation.terminal.fade], low: 0.5, high: 1.0, dist: triangular, unit: number}
                                                               # множитель к избытку ROE над стоимостью капитала; одностороннее (A-V4)
      - {name: "Веса миров", kind: dict, paths: [joint.world_prob], low: {N: 0.25, H: 0.50, M: 0.25}, high: {N: 0.40, H: 0.45, M: 0.15}, dist: triangular}   # запись семейства (A-P1)
      - {name: "Инфляция мира M", kind: shift, paths: [worlds.M.cpi, worlds.M.wage_growth, worlds.M.lt_inflation], low: -0.003, high: 0.005, dist: triangular, unit: pp}   # запись семейства (A-M1)
      - {name: "Распределение сдвига σ0: доля кредитных книг (A-N7)", kind: value, paths: [nii.sigma0_split], low: 0.0, high: 0.09, dist: triangular, unit: pct}
                                                               # оси долей лежат в области гейта lt_spread_floor: вдоль них, при прочих осях на значениях книги, гейт проходит во всех мирах.
                                                               #   низ — весь сдвиг на средствах клиентов; верх — значение книги: наибольшая доля, при которой спред
                                                               #   корпоративных кредитов к ОФЗ 1 г. в мире H не ниже пола (ось односторонняя: выше пол нарушен)
      - {name: "Распределение сжатия φ: доля кредитных книг (A-N8)", kind: value, paths: [nii.phi_split], low: 0.0, high: 0.001, dist: triangular, unit: pct}
                                                               # низ (книга) — всё сжатие на средствах клиентов; верх — наибольшая доля, при которой при доле σ0 книги гейт
                                                               #   проходит в мире M: 0,0012, вниз до 0,001. Доля по наклонам истории (0,33) — вне области гейта, осью не
                                                               #   разыгрывается; её цена — строка суждения A-N8
    off_band_axes: []                                          # оси вне полосы — пусто. Ось допустима здесь только при трёх условиях MODEL §10: ожидаемая доля
                                                               #   в дисперсии < 1 %, сдвиг положения оси и сумма сдвигов по осям вне полосы меньше print_step/10;
                                                               #   односторонние рисковые оси (налог, разовый налог, разовый убыток кризиса) и словари — никогда
  reverse_dcf:                                                 # обратный расчёт медианы (MODEL §11); search — отрезок поиска (технический), range — диапазон книги
    subsample: 200
    axes:
      - {name: "ЧПМ сквозь цикл", kind: value, paths: [nii.nim_lt_target_mgmt], search: [0.03, 0.09], range: [0.054, 0.067], unit: "%"}
      - {name: "CoR сквозь цикл (сдвиг LT)", kind: shift, paths: [regimes.soft.cor.LT, regimes.norm.cor.LT, regimes.downturn.cor.LT, regimes.crisis.cor.LT], search: [-0.012, 0.04], range: [-0.003, 0.005], unit: "п.п."}
      - {name: "Передача ставки в ЧПМ", kind: value, paths: [nii.transmission.target], search: [-0.10, 0.50], range: [0.0, 0.14], unit: ""}
      - {name: "Выплата (отклонение доли от политики)", kind: shift, paths: [dividends.payout_deviation], search: [-0.5, 0.5], range: [-0.10, 0.0], unit: "п.п."}
      - {name: "β_E", kind: value, paths: [valuation.beta_e], search: [0.3, 3.5], range: [0.70, 1.05], unit: ""}
      - {name: "ERP", kind: value, paths: [valuation.erp], search: [0.02, 0.25], range: [0.049, 0.062], unit: "%"}
