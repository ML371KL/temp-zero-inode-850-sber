# ------------------------------------------------------------------ СОВМЕСТНЫЕ ВЕРОЯТНОСТИ (A-P*)
joint:
  world_prob: {N: 0.35, H: 0.45, M: 0.20}                # A-P1: слой «свой макро-взгляд» [Ф: общая запись сценариев ставок семейства моделей — magnit-850oa book-1.6]
  world_prob_market_implied: {N: 0.10, H: 0.25, M: 0.65} # A-P1m: слой «вменённые рынком» [Ф: запись magnit-850oa book-1.6]
  macro_neutral_world: M                                 # A-P1n: слой «рыночные ставки как есть» [Ф: 850oa]
  own_macro_confidence: 0.5                              # A-P1c: λ, доля [Ф: 850oa; DESIGN §3.6]
  regime_prob: {soft: 0.15, norm: 0.40, downturn: 0.30, crisis: 0.15}   # A-P2b: одна конвенция во всех мирах и слоях [Р/В: частота мягких лет, спадов и кризисов у банка в 2008–2025 годах]
                                                         #   кризис — 3 года из 18, шок в окне 1,25 года ≈ 0,19; сигналы отчётности 6М26; вероятность кризиса 10–25 % — ось полосы
  reg_prob_given_regime:                                 # A-K1b: P(сценарий капитала | режим), доли [В: DESIGN §3.4; опоры этапа 1 нет]; ось — mix обратного расчёта
    soft:     {schedule: 0.25, upper: 0.45, strict: 0.30}
    norm:     {schedule: 0.25, upper: 0.45, strict: 0.30}
    downturn: {schedule: 0.25, upper: 0.45, strict: 0.30}
    crisis:   {schedule: 0.70, upper: 0.25, strict: 0.05}   # в кризисе масса смещена к «по графику» (антициклическая надбавка распускается) [В: DESIGN §3.4]
  regime_update:                                         # A-P2u: квартальные наблюдения CoR и ЧПМ (MODEL §12)
    observables:
      cor: {sigma_pp: 0.0035, rho_q: 0.5}                # σ — стационарное с.о. отклонения CoR от пути, доли годовых [Р: regimes — шум квартала 0,33 п.п., 2016–2025];
                                                         #   ρ за квартал [В: VM §8.13]
      nim: {sigma_pp: 0.002, rho_q: 0.7}                 # σ [Р: regimes — ЧПМ к/к 0,19 п.п.]; ρ [В: VM §8.13]
    max_shift_pp: 0.05                                   # предел сдвига вероятности режима за одно квартальное наблюдение: 0,10 850oa «на полугодие» / 2 [Р]
    window_obs: 4                                        # фильтр читает четыре последних квартальных наблюдения (год отчётов); априорные на каждом якоре —
                                                         #   базовые regime_prob: режимы стационарны; окно вымывание хвостов ограничивает, но не снимает
                                                         #   [В: решение ведущего В2; MODEL §12]
    floor_share: 0.33                                    # A-P2u: пол вероятности режима — после каждого наблюдения не ниже 0,33 × базовой (мягкая посадка и кризис —
                                                         #   не ниже 4,95 %, нормализация — 13,2 %, спад — 9,9 %): режим остаётся возможным, сколько бы отчётов
                                                         #   «без новостей» ни прошло [В: решение ведущего В15; MODEL §12]
    shrink_by_se: true                                   # у нау-каста (se > 0) — Калман со сжатием (850oa Р12)
    observations: []                                     # [{period: "2026Q3", cor: 0.012, nim: 0.060, se_cor: 0.0, se_nim: 0.0, basis: mgmt}] — факт МСФО 3К26 (28.10.2026);
                                                         #   у наблюдений квартала не позже якоря — ещё mu_cor, mu_nim (пишет перезаякоривание, MODEL §15.2)

# ------------------------------------------------------------------ РЕЖИМЫ ДОХОДНОСТИ И КРЕДИТНОГО ЦИКЛА (A-C*b)
# CoR режимов — УПРАВЛЕНЧЕСКИЙ базис (cor_basis: mgmt): ядро переводит пути мостом to_engine_cor (MODEL §4.6; факт
# bridge_mgmt_ifrs.cor = +0,0017, окно 1К24–2К26). Центры [Р/В: regimes — референс-класс 2008–2026; DESIGN §3.4].
# Взвешенный LT-CoR 1,53 % упр. ≈ 1,70 % движок [Р]. Ключ "2026" действует на 2026К3–К4 (якорь — 2026К2).
# Ближний сдвиг ЧПМ — отдельная траектория near_nim_shift, общая для всех режимов и миров (MODEL §3.2, A-C4b):
# −0,005 в 3К–4К26 (калибровка calib-nii §5: механика книг 3К26 ≈6,85 % движок против гайденса 6,2 % упр.; РСБУ
# июля–августа ≈ −0,2 п.п. маржи), в 2027 — линейный сход к нулю по кварталам (решение ведущего A1 F2), с 2028 — 0.
# nim_shift режимов несёт только сдвиг самого режима (ключ "2026" — 0 у всех).
regimes:
  ids: [soft, norm, downturn, crisis]
  cor_basis: mgmt                    # базис путей cor: mgmt (перевод to_engine_cor в ядре) | engine
  near_nim_shift: {"2026": -0.005, "2027Q1": -0.00375, "2027Q2": -0.0025, "2027Q3": -0.00125, "2027Q4": 0.0, "2027": -0.001875, LT: 0.0}
                                     # A-C4b, базис движка; ключ "2027" = среднее кварталов (MODEL §0.4); с 2028 — LT 0 [В: A1 F2]
  soft:
    name: "Мягкая посадка"
    cor: {"2026": 0.012, "2027": 0.010, "2028": 0.009, "2029": 0.010, LT: 0.011, LT_from: 2030}   # аналог 2017→2019 [Р: стоимость риска банка по фазам кредитного цикла 2008–2026 годов]
    nim_shift: {"2026": 0.0, "2027": 0.001, LT: 0.002, LT_from: 2029}                          # +0,1 п.п. в 2027, LT +0,2 п.п. [В: regimes]
    loan_growth_adj: {"2026": 0.0, "2027": 0.01, "2028": 0.01, LT: 0.0, LT_from: 2029}         # +1 п.п. к миру в 2027–28 [Р: regimes — Сбер в доброкачественные годы растёт быстрее сектора]
  norm:
    name: "Нормализация"
    cor: {"2026": 0.014, "2027": 0.015, "2028": 0.014, "2029": 0.014, LT: 0.014, LT_from: 2030}   # [В: DESIGN §3.4 = regimes]
    nim_shift: {"2026": 0.0, LT: 0.0}                                                            # база; LT 0
    loan_growth_adj: {LT: 0.0}
  downturn:
    name: "Корпоративный спад"
    cor: {"2026": 0.016, "2027": 0.023, "2027Q1": 0.021, "2027Q2": 0.023, "2027Q3": 0.024, "2027Q4": 0.024, "2028": 0.020, "2029": 0.016, LT: 0.017, LT_from: 2030}
                                                                                                 # профиль 2027 — признание растянуто реструктуризациями [В: regimes]
    nim_shift: {"2026": 0.0, "2027": -0.002, "2028": -0.002, LT: -0.001, LT_from: 2029}         # −0,2 п.п. в 2027–28, LT −0,1 п.п. [В: regimes]
    loan_growth_adj: {"2026": 0.0, "2027": -0.03, "2028": -0.03, LT: 0.0, LT_from: 2029}        # −3 п.п. к миру (проинфляционный сценарий ЦБ) [В: DESIGN §3.4; regimes]
  crisis:
    name: "Кризис"
    cor: {"2026": 0.016, "2027": 0.038, "2027Q1": 0.050, "2027Q2": 0.040, "2027Q3": 0.034, "2027Q4": 0.028, "2028": 0.025, "2029": 0.016, LT: 0.020, LT_from: 2030}
                                                                                                 # профиль МСФО 9 — пик в квартале шока [В: regimes]
    nim_shift: {"2026": 0.0, "2027": -0.004, LT: -0.002, LT_from: 2028}                        # −0,4 п.п. на 4 квартала 2027, LT −0,2 п.п. [В: падение маржи банка в кризисы 2009, 2014–2015, 2020 и 2022 годов]
                                                                                                 #   ось 2027: 0…−1,2 п.п.
    loan_growth_adj: {"2026": 0.0, "2027": 0.0, "2028": 0.0, "2029": 0.01, LT: 0.0, LT_from: 2030}   # 2027–28 заменяет override; +1 п.п. в 2029 [В: regimes]
    loan_growth_override: {"2027": 0.025, "2028": 0.045}       # абсолютный рост кредита: середины рискового сценария ЦБ 0–5 % / 2–7 % [Р: ОНДКП табл. 3.5]
    one_off_loss: {period: "2027Q1", amount: -400.0}           # разовый убыток до налога ≈5 % BV [Р/В: разовые убытки банка в кризисы 2008, 2014 и 2022 годов — до 12 % капитала]
                                                               #   2008 — 5 %, 2014 — 0,5 %, 2022 — 11,9 % капитала; ось 0…−1 000
    shock_year_offset: 1                                       # год шока = год якоря + 1 (2027): отменяется выплата, решаемая в этом году (за 2026); кризисные
                                                               #   ключи (профиль cor, период one_off_loss, первый год override) лежат в году шока и при
                                                               #   перезаякоривании сдвигаются с якорем [В: DESIGN §3.5 п. 7; решение ведущего В2; MODEL §3.2]

credit:                                                        # резервы (MODEL §4.6); CoR движка = llp_debt_fa / средние валовые кредиты АС
  kappa: 0.05                                                  # A-C2b: доля CoR на долю реальной ставки мира сверх мира N [Р/В: связь стоимости риска с реальной ставкой: 2014–2026 годы и текущий цикл]
                                                               #   регрессии 2014–2026 −0,02…+0,03, текущий цикл 0,07–0,10; ось 0–0,15
  real_rate_lag_q: 4                                           # L, кварталов [В: regimes]
  segment_relative: {enabled: false, corporate: null, retail: null}   # сегментная CoR выключена в 1.0: пропорциональная схема даёт неверный знак в «спаде»
                                                               #   (упр. 2024–2026: ЮЛ 0,52 %, ФЛ 2,10 % [Ф: mgmt]); при enabled: true — отношения к общей CoR
  fv_loans_factor: 1.0                                         # A-C9: доля отклонения CoR от опоры, проходящая в переоценку кредитов по СС (0 выключает строку FVC).
                                                               #   Уровень переоценки — в «прочем» (остаток PBT, без двойного счёта, A3); строка FVC несёт только
                                                               #   отклонение режима от опоры [В: решение ведущего В4; MODEL §4.6]
  fv_loans_ref: norm                                           # A-C9: режим-опора FVC — «нормализация»: в её клетке мира N FVC = 0; нижняя граница эффекта
                                                               #   (окно калибровки «прочего» 2024–1П26 лежит ниже нормы) [В: решение ведущего В4]. Опора — путь нормы
                                                               #   КНИГИ до розыгрыша осей и поисков: сдвиг уровня CoR всех режимов доходит до кредитов по СС
                                                               #   [В: решение ведущего В14; MODEL §4.6]
