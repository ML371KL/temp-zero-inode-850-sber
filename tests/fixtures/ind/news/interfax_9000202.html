<p>Москва. 29 апреля. INTERFAX.RU - Наблюдательный совет Сбербанка вынес на годовое собрание предложение выплатить за 2025 год по 37,64 рубля на одну акцию, обыкновенную или привилегированную, сообщил банк.</p>
<p>Отсечку под дивиденды совет предложил провести 20 июля 2026 года.</p>
