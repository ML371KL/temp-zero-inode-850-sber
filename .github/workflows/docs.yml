name: Документы

# Лёгкий прогон для документов: коммит из одних *.md не будит ci.yml
# (paths-ignore), а документы сверяют с кодом и выпуском тесты с меткой `docs`
# (ops/README.md против конвейера, INTERFACES против образца env-файла, тексты
# книги и фактов). Здесь же — гигиена публичного репозитория (IP, почты, пути,
# токены в документах; метка `tact`), гигиена истории и числа документов.
on:
  push:
    paths: ["**/*.md"]
  pull_request:
    paths: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONIOENCODING: utf-8

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Зависимости
        run: python -m pip install --quiet -r requirements.txt

      - name: Гигиена истории
        run: |
          git log --all --format='%H %ae %ce' > "$RUNNER_TEMP/who.txt"
          bad=$(awk 'NR==FNR { if ($0 !~ /^#/ && NF) ok[$1] = 1; next }
                     !(($2 in ok) && ($3 in ok)) { print $1 }' .github/commit-emails.allow "$RUNNER_TEMP/who.txt")
          if [ -n "$bad" ]; then
            echo "::error::адрес автора или коммиттера вне .github/commit-emails.allow в коммитах:"
            echo "$bad"
            exit 1
          fi

      - name: Тесты документов и гигиена дерева
        run: python -m pytest -rs -m "(docs or tact) and not network and not archive" --strict-markers

      - name: Числа документов
        # Числа ядра в документах — метки, равные results.json (ops/tools/render_numbers.py).
        run: python -B ops/tools/render_numbers.py --check
